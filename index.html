:root[data-mode="fight"] .fx-sets .set.on small{color:rgba(42,22,6,.6)}
:root[data-mode="fight"] .fx-sets .set:active{transform:scale(.94)}
:root[data-mode="fight"] .fx-sets .done-btn{grid-column:1/-1;height:64px;border-radius:20px;background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2);font-size:17px}
:root[data-mode="fight"] .fx-sets .done-btn.on{background:linear-gradient(140deg,#7BE3A6,var(--gr));color:#06301a;box-shadow:0 8px 20px rgba(47,191,113,.35)}
:root[data-mode="fight"] .fx-nav{display:grid;grid-template-columns:auto 1fr;gap:10px;position:sticky;bottom:0;padding-top:6px}
.fx-sec{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.fx-sec svg{width:22px;height:22px}
:root[data-mode="fight"] .fx-nav .fx-cta{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){:root[data-mode="fight"] .fx-sheet,:root[data-mode="fight"] .fx-sheet>*{animation:none}}

/* ===== transformation, record, journal ===== */
.tfx{position:fixed;inset:0;z-index:46;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(12,16,40,.55),rgba(6,8,24,.92));animation:fade .3s ease-out}
.tfx.out{animation:tfxOut .5s ease-in forwards}
@keyframes tfxOut{to{opacity:0}}
.tfx>*{grid-area:1/1}
.tfx-rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;background:repeating-conic-gradient(from 0deg,var(--glow) 0 6deg,transparent 6deg 18deg);opacity:0;border-radius:50%;
  -webkit-mask-image:radial-gradient(circle,#000 10%,transparent 55%);mask-image:radial-gradient(circle,#000 10%,transparent 55%);animation:rays 3.4s ease-out forwards}
@keyframes rays{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.6)}35%{opacity:.9}100%{opacity:.55;transform:translate(-50%,-50%) rotate(40deg) scale(1)}}
.tfx-old,.tfx-new{width:min(220px,56vw);height:min(220px,56vw);border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px rgba(0,0,0,.4)}
.tfx-old{animation:tOld 1.2s ease-in forwards}
@keyframes tOld{0%{transform:scale(1);filter:none}60%{transform:scale(1.04);filter:brightness(2.2)}100%{transform:scale(.9);opacity:0;filter:brightness(4)}}
.tfx-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:tFlash 1.6s ease-out forwards}
@keyframes tFlash{0%,55%{opacity:0}65%{opacity:.95}100%{opacity:0}}
.tfx-new{opacity:0;box-shadow:0 0 0 4px var(--aura),0 0 60px 10px var(--glow);animation:tNew 2.4s cubic-bezier(.16,1,.3,1) 1s forwards}
@keyframes tNew{0%{opacity:0;transform:scale(1.4)}30%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
.tfx-txt{position:absolute;left:0;right:0;bottom:14vh;text-align:center;opacity:0;animation:rise .5s cubic-bezier(.16,1,.3,1) 1.5s forwards}
.tfx-txt small{display:block;font-family:var(--hud);font-weight:700;letter-spacing:.3em;color:var(--aura);font-size:13px}
.tfx-txt b{display:block;font-family:"Bangers",sans-serif;font-weight:400;font-size:clamp(46px,13vw,80px);letter-spacing:.03em;color:#fff;-webkit-text-stroke:3px rgba(0,0,0,.6);paint-order:stroke fill;text-shadow:0 0 30px var(--glow)}
.tfx-txt span{font-family:var(--hud);color:rgba(255,255,255,.8);font-size:14px}
.rfx{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none;background:rgba(10,8,30,.45);animation:fade .2s}
.rfx.out{animation:tfxOut .4s ease-in forwards}
.rfx-card{width:min(320px,86vw);padding:22px 20px;border-radius:26px;text-align:center;color:#fff;background:linear-gradient(160deg,rgba(40,30,80,.95),rgba(14,16,40,.97));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),0 0 0 2px rgba(255,226,52,.6),0 0 50px rgba(255,226,52,.35);animation:rCard .5s cubic-bezier(.16,1,.3,1)}
@keyframes rCard{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.rfx-card small{font-family:var(--hud);font-weight:700;letter-spacing:.24em;color:var(--ye);font-size:13px}
.rfx-card>b{display:block;font-family:"Bangers",sans-serif;font-weight:400;font-size:34px;letter-spacing:.03em;margin:4px 0 10px}
.rfx-v{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--hud)}
.rfx-v span{font-size:20px;color:rgba(255,255,255,.55);text-decoration:line-through}
.rfx-v i{font-style:normal;color:var(--or);font-size:22px}
.rfx-v strong{font-size:34px;color:var(--ye);text-shadow:0 0 16px rgba(255,226,52,.5)}
.rfx-g{margin-top:10px;font-family:var(--hud);font-size:13px;color:#9BF0B9}
@media (prefers-reduced-motion:reduce){.tfx-rays,.tfx-flash{display:none}.tfx-old{display:none}.tfx-new,.tfx-txt{animation:none;opacity:1}}
.jr-l{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:14px}
.jr-l::before{content:"";position:absolute;left:17px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,rgba(255,226,52,.6),rgba(255,255,255,.08))}
.jr-l li{position:relative;display:flex;gap:12px;align-items:flex-start}
.jr-ic{position:relative;z-index:1;width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--jc,#7FB2FF);color:#111;box-shadow:0 0 0 4px rgba(14,20,52,.9),0 0 14px var(--jc,#7FB2FF)}
.jr-ic svg{width:17px;height:17px}
.jr-start{--jc:#F6F1E7}.jr-week{--jc:#7FB2FF}.jr-record{--jc:#FFE234}.jr-tier{--jc:#F5A04A}
.jr-b{min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.jr-b small{font-family:var(--hud);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.jr-b b{font-size:15.5px;color:#fff}
.jr-b p{margin:0;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.75)}
.jr-more{align-self:flex-start;margin-top:4px}

/* Exercices du jour : cartes sombres lumineuses, dans le style du panneau d'exercice */
:root[data-mode="fight"] .fx-r{position:relative;overflow:hidden;color:#fff;padding:12px 14px 12px 12px;border-radius:22px;
  background:linear-gradient(160deg,rgba(40,32,88,.9),rgba(14,18,46,.94));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.08),0 12px 28px rgba(20,8,40,.35)}
:root[data-mode="fight"] .fx-r::before{content:"";position:absolute;right:-40px;top:-50px;width:140px;height:140px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(164,123,201,.35),transparent 70%)}
:root[data-mode="fight"] .fx-r>*{position:relative}
:root[data-mode="fight"] .fx-t b{color:#fff}
:root[data-mode="fight"] .fx-t small{color:rgba(255,255,255,.62)}
:root[data-mode="fight"] .fx-n b{color:#fff}
:root[data-mode="fight"] .mini-ring .b{stroke:rgba(255,255,255,.14)}
:root[data-mode="fight"] .mini-ring .f{stroke:var(--or);filter:drop-shadow(0 0 4px rgba(245,160,74,.7))}
:root[data-mode="fight"] .fx-chev{color:rgba(255,255,255,.5)}
:root[data-mode="fight"] .fx-r.cur{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1.5px rgba(245,160,74,.85),0 0 24px rgba(245,160,74,.35),0 12px 28px rgba(20,8,40,.35)}
:root[data-mode="fight"] .fx-r.cur::before{background:radial-gradient(circle,rgba(245,160,74,.45),transparent 70%)}
:root[data-mode="fight"] .fx-r.d{background:linear-gradient(160deg,rgba(22,70,58,.9),rgba(12,30,34,.94))}
:root[data-mode="fight"] .fx-r.d::before{background:radial-gradient(circle,rgba(47,191,113,.4),transparent 70%)}
:root[data-mode="fight"] .fx-r.d .mini-ring .f{stroke:var(--gr);filter:drop-shadow(0 0 4px rgba(47,191,113,.7))}
:root[data-mode="fight"] .fx-r.d .fx-n b{color:#9BF0B9}
:root[data-mode="fight"] .fx-tag{background:linear-gradient(135deg,#FFD27A,var(--or));box-shadow:0 0 12px rgba(245,160,74,.5)}

.rewards{display:flex!important;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-16px;padding:4px 16px 6px;scroll-padding-inline:16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent)}
.rewards::-webkit-scrollbar{display:none}
.rewards .rw-it{flex:0 0 82px;scroll-snap-align:start}

.rw-wrap{position:relative}
.rw-more{position:absolute;right:-6px;top:16px;width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--surface-2);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .2s;animation:rwnudge 1.6s ease-in-out infinite}
.rw-more svg{width:16px;height:16px}
.rw-more.end{opacity:0;pointer-events:none}
@keyframes rwnudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.rw-more{animation:none}}
:root[data-mode="fight"] .rw-more{background:rgba(255,255,255,.92);color:#1A3FA8}

.bk-row{display:flex;flex-wrap:wrap;gap:10px}
.bk-btn{flex:1 1 160px;min-height:46px;border-radius:14px;border:0;font:inherit;font-weight:700;font-size:14px;display:grid;place-items:center;cursor:pointer;background:var(--btn);color:var(--btn-ink);padding:0 14px;text-align:center}
.bk-btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}

.ex-type{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(17,17,17,.08)}
.ex-type button{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:700;font-size:13px;color:inherit;opacity:.65;background:transparent;cursor:pointer}
.ex-type button.on{opacity:1;background:rgba(255,255,255,.75);color:#111;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ed-grid.cardio{grid-template-columns:minmax(0,160px)}
.add-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.add-row .add{width:100%}

/* barre de navigation collée au bas de l'écran */
.bnav,:root[data-mode] .bnav{left:0;right:0;bottom:0;transform:none;width:auto;border-radius:22px 22px 0 0;
  padding:8px max(12px,calc((100% - 480px)/2)) calc(8px + env(safe-area-inset-bottom,0px));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 -8px 24px rgba(0,0,0,.18)}
:root[data-mode="light"] .bnav{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 -8px 24px rgba(60,50,120,.12)}
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* ================= Nova : modes Sombre et Clair ================= */
:root[data-ui="nova"]{
  --bg:#120D18; --surface:#1E1727; --surface-2:#2A2134; --ink:#F6F2FA; --muted:#A99FB6; --line:rgba(255,255,255,.09);
  --c1:#C3C4FF; --c2:#B7A6F7; --c3:#2A2134; --lav:#B9B6FF; --mint:#9FE3DC; --pink:#F6B8E2; --yellow:#FFD27A; --peach:#FFC48A; --sage:#2A2134;
  --btn:#F6F2FA; --btn-ink:#120D18; --navc:#C3C4FF; --danger:#FF9AA8;
  --nx-ink:#1C1427; --nx-ink-soft:rgba(28,20,39,.62); --nx-glass:rgba(255,255,255,.055); --nx-glass-2:rgba(255,255,255,.09);
  --nx-lav:linear-gradient(145deg,#D3D5FF 0%,#A9A3F7 100%);
  --nx-peach:linear-gradient(145deg,#FFE7A3 0%,#FFB772 100%);
  --nx-mint:linear-gradient(145deg,#CDF6EF 0%,#86D8D0 100%);
  --nx-pink:linear-gradient(145deg,#FFDDF1 0%,#F0A6D7 100%);
  --nx-glow1:rgba(150,88,205,.30); --nx-glow2:rgba(84,64,170,.24); --nx-pill:#FFD27A;
  color-scheme:dark;
}
:root[data-ui="nova"][data-mode="light"]{
  --bg:#F6F2FA; --surface:#FFFFFF; --surface-2:#F0EAF7; --ink:#1C1427; --muted:#6E6480; --line:rgba(28,20,39,.09);
  --c3:#FFFFFF; --sage:#FFFFFF; --btn:#1C1427; --btn-ink:#FFFFFF; --navc:#6E5CF0; --danger:#C2364A;
  --nx-glass:#FFFFFF; --nx-glass-2:#F3EEF9;
  --nx-glow1:rgba(196,160,240,.45); --nx-glow2:rgba(170,180,255,.40);
  color-scheme:light;
}
:root[data-ui="nova"] body{background:
  radial-gradient(90% 55% at 0% 0%,var(--nx-glow1),transparent 62%),
  radial-gradient(70% 45% at 100% 22%,var(--nx-glow2),transparent 60%),var(--bg);background-color:var(--bg)}
:root[data-ui="nova"] .wrap{gap:22px}

/* en-tête */
.nh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nh-l{display:flex;align-items:center;gap:12px;min-width:0}
.nh-av{width:46px;height:46px;border-radius:50%;display:block;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px color-mix(in srgb,var(--ink) 18%,transparent)}
.nh-t{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.nh-t small{color:var(--muted);font-size:13px;font-weight:500}
.nh-t .app-title{font-family:var(--display);font-weight:700;font-size:17.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh-r{display:flex;align-items:center;gap:10px}
.nh-r .sync{font-size:12px;color:var(--muted)}
.nh-b{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--nx-glass-2);border:0;cursor:pointer;transition:transform .15s}
.nh-b svg{width:20px;height:20px}
.nh-b:active{transform:scale(.92)}
:root[data-mode="light"] .nh-b{background:#fff;box-shadow:0 2px 10px rgba(60,40,100,.08)}

/* semaine façon calendrier */
.nw-sec{display:flex;flex-direction:column;gap:14px}
.nw-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.nw-title{margin:0;font-family:var(--display);font-size:clamp(30px,8.6vw,40px);line-height:1.02;letter-spacing:-.02em;font-weight:300;text-wrap:balance}
.nw-title b{font-weight:800}
.nw-range{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.nw{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.nw-d{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 2px;border:0;background:none;color:var(--ink);cursor:pointer;font:inherit}
.nw-d small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.nw-d b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:15.5px;font-weight:600;transition:background .2s,color .2s}
.nw-d:not(.has) b{color:color-mix(in srgb,var(--ink) 45%,transparent)}
.nw-d.today b{box-shadow:inset 0 0 0 1.5px var(--ink);border:0;outline:1.5px dashed transparent}
.nw-d.today:not(.sel) b{box-shadow:none;outline:1.5px dashed color-mix(in srgb,var(--ink) 70%,transparent);outline-offset:-1.5px}
.nw-d.sel b{background:var(--nx-lav);color:var(--nx-ink);font-weight:800;box-shadow:0 6px 18px rgba(150,140,250,.35)}
.nw-d i{width:5px;height:5px;border-radius:50%;background:transparent}
.nw-d.has i{background:color-mix(in srgb,var(--ink) 30%,transparent)}
.nw-d.done i{background:var(--mint);box-shadow:0 0 8px var(--mint)}
:root[data-mode="light"] .nw-d.done i{background:#2DB3A6;box-shadow:none}
.nw-stats{display:flex;gap:8px;flex-wrap:wrap}
.nw-stats span{flex:1 1 auto;text-align:center;padding:9px 10px;border-radius:99px;background:var(--nx-glass);font-size:12.5px;color:var(--muted);white-space:nowrap}
.nw-stats b{color:var(--ink);font-weight:800;margin-right:2px}
:root[data-mode="light"] .nw-stats span{box-shadow:0 1px 0 rgba(28,20,39,.04),inset 0 0 0 1px var(--line)}

/* cartes pastel */
:root[data-ui="nova"] .hero{display:flex;flex-direction:column;gap:14px;background:none;padding:0;box-shadow:none}
.nx-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nx-card{position:relative;overflow:hidden;border-radius:28px;padding:16px;color:var(--nx-ink);display:flex;flex-direction:column;gap:12px;min-width:0;isolation:isolate}
.nx-card::before{content:"";position:absolute;z-index:-1;width:150%;aspect-ratio:1;border-radius:50%;right:-75%;top:-55%;background:radial-gradient(circle at 35% 60%,rgba(255,255,255,.55),rgba(255,255,255,0) 62%)}
.nx-card::after{content:"";position:absolute;z-index:-1;width:90%;aspect-ratio:1;border-radius:50%;left:-40%;bottom:-48%;background:rgba(255,255,255,.18)}
.nx-lav{background:var(--nx-lav)} .nx-peach{background:var(--nx-peach)} .nx-mint{background:var(--nx-mint)} .nx-pink{background:var(--nx-pink)}
.nx-ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nx-ch b{font-family:var(--display);font-size:18px;line-height:1.08;font-weight:800}
.nx-ic{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.45)}
.nx-ic svg{width:19px;height:19px}
.nx-plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.nx-plan li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:16px;border:1.5px dashed rgba(28,20,39,.28);min-width:0}
.nx-plan li.ok{border-style:solid;border-color:transparent;background:rgba(255,255,255,.4)}
.nx-cb{width:20px;height:20px;flex:none;border-radius:50%;border:1.6px solid rgba(28,20,39,.5);display:grid;place-items:center}
.nx-plan li.ok .nx-cb{background:var(--nx-ink);border-color:var(--nx-ink);color:#fff}
.nx-cb svg{width:12px;height:12px}
.nx-pt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.nx-plan .nx-pt b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx-plan .nx-pt small{font-size:11px;color:var(--nx-ink-soft)}
.nx-more{font-size:12px;font-weight:700;color:var(--nx-ink-soft);padding-left:4px}
.nx-start{justify-content:space-between}
.nx-date{font-size:11.5px;font-weight:600;color:var(--nx-ink-soft)}
.nx-start h1{margin:0;font-family:var(--display);font-size:clamp(20px,5.6vw,26px);line-height:1.05;font-weight:400;letter-spacing:-.01em;color:var(--nx-ink);text-wrap:balance;overflow-wrap:anywhere}
.nx-start h1 em{display:block;font-style:normal;font-weight:800;margin-top:2px}
.nx-go{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px;color:var(--nx-ink);
  background:rgba(255,255,255,.72);border-radius:99px;padding:5px 5px 5px 16px;transition:transform .15s}
.nx-go i{width:38px;height:38px;border-radius:50%;background:var(--nx-ink);color:#fff;display:grid;place-items:center;font-style:normal}
.nx-go i svg{width:15px;height:15px}
.nx-go:active{transform:scale(.97)}
.nx-go.done{cursor:default}
.nx-go.done i{background:#2DB3A6}

/* progression */
.nx-prog{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border-radius:28px;background:#F4F0F8;color:var(--nx-ink)}
:root[data-mode="light"] .nx-prog{background:#fff;box-shadow:0 8px 26px rgba(70,40,120,.08)}
.nx-pi{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--nx-peach)}
.nx-pi svg{width:24px;height:24px}
.nx-prog .nx-pt{flex:1}
.nx-prog .nx-pt b{font-size:16px;font-weight:800}
.nx-prog .nx-pt small{font-size:12.5px;color:var(--nx-ink-soft);font-weight:500}
.nx-ring{width:62px;height:62px;flex:none}
.nx-ring circle{fill:none;stroke-width:6}
.nx-ring .bg{stroke:rgba(28,20,39,.08)}
.nx-ring .fg{stroke:#8E80F2;stroke-linecap:round;transition:stroke-dashoffset .5s}
.nx-ring text{font-size:14px;font-weight:800;fill:var(--nx-ink)}

/* exercices en frise */
.nx-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
.nx-h h2{margin:0;font-family:var(--display);font-size:24px;font-weight:300;letter-spacing:-.01em}
.nx-h h2 b{font-weight:800}
.nx-h span{color:var(--muted);font-weight:700;font-size:14px}
.nx-tl{display:flex;flex-direction:column;gap:12px;position:relative}
.nx-it{position:relative;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.nx-it:not(:last-child)::before{content:"";position:absolute;left:16.25px;top:40px;bottom:-14px;border-left:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent)}
.nx-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:12px;
  background:var(--nx-glass-2);color:var(--ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 18%,transparent)}
.nx-it.ok .nx-dot{background:var(--acc);color:var(--nx-ink);box-shadow:none}
.nx-it.now .nx-dot{background:var(--ink);color:var(--bg);box-shadow:0 0 0 5px color-mix(in srgb,var(--ink) 12%,transparent)}
.nx-dot svg{width:15px;height:15px}
.nx-body{min-width:0;border-radius:24px;padding:14px 15px;background:var(--nx-glass);display:flex;flex-direction:column;gap:9px;transition:background .25s}
:root[data-mode="light"] .nx-body{box-shadow:0 6px 22px rgba(70,40,120,.07)}
.nx-it.now .nx-body{background:var(--acc);color:var(--nx-ink)}
.nx-it.ok .nx-body{opacity:.62}
.nx-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.nx-top h3{margin:0;font-family:var(--display);font-size:17px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.nx-now{flex:none;padding:5px 12px;border-radius:99px;background:#7EE08A;color:#0F2A14;font-size:12px;font-weight:800}
.nx-fait{flex:none;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--muted)}
.nx-meta{display:flex;flex-wrap:wrap;gap:6px}
.nx-meta span{padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--muted)}
.nx-meta span:first-child{background:var(--acc);color:var(--nx-ink)}
.nx-it.now .nx-meta span{background:rgba(255,255,255,.5);color:var(--nx-ink)}
.nx-items{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.nx-items li{display:flex;justify-content:space-between;gap:8px}
.nx-load{display:flex;align-items:center;gap:10px;padding:5px 5px 5px 14px;border-radius:16px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.nx-load span{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nx-load input{flex:1;min-width:0;border:0;border-radius:12px;padding:8px 12px;font:inherit;font-weight:700;font-size:15px;background:var(--surface);color:var(--ink)}
.nx-it.now .nx-load{background:rgba(255,255,255,.4)} .nx-it.now .nx-load span{color:var(--nx-ink-soft)}
.nx-it.now .nx-load input{background:rgba(255,255,255,.85);color:var(--nx-ink)}
.nx-note{margin:0;font-size:13.5px;color:var(--muted)}
.nx-it.now .nx-note{color:var(--nx-ink-soft)}
.nx-sets{display:flex;flex-wrap:wrap;gap:8px}
.nx-set{width:44px;height:44px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--ink) 35%,transparent);background:transparent;color:inherit;font:inherit;font-weight:800;font-size:15px;display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .2s}
.nx-set:active{transform:scale(.9)}
.nx-set.on{border:0;background:var(--ink);color:var(--bg)}
.nx-set svg{width:17px;height:17px}
.nx-it.now .nx-set{border-color:rgba(28,20,39,.4)}
.nx-it.now .nx-set.on{background:var(--nx-ink);color:#fff}
.nx-done{display:flex;align-items:center;gap:8px;border:1.5px dashed color-mix(in srgb,var(--ink) 35%,transparent);background:transparent;color:inherit;font:inherit;font-weight:800;font-size:14.5px;border-radius:99px;padding:10px 18px;cursor:pointer}
.nx-done svg{width:16px;height:16px}
.nx-done.on{border:0;background:var(--ink);color:var(--bg)}
.nx-it.now .nx-done{border-color:rgba(28,20,39,.4)}
.nx-it.next-up .nx-body{animation:nxpulse .9s ease}
@keyframes nxpulse{0%{transform:scale(1)}35%{transform:scale(1.02)}100%{transform:scale(1)}}

/* bouton de fin */
.nx-cta{justify-content:center}
.nx-fin{display:flex;align-items:center;gap:14px;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:16px;color:var(--btn-ink);background:var(--btn);border-radius:99px;padding:7px 7px 7px 24px;transition:transform .15s}
.nx-fin i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--btn-ink);color:var(--btn);font-style:normal}
.nx-fin i svg{width:20px;height:20px}
.nx-fin.ok i{background:#2DB3A6;color:#fff}
.nx-fin:active{transform:scale(.97)}

/* jour de repos et autres onglets */
:root[data-ui="nova"] .hero h1{font-weight:300;letter-spacing:-.02em}
:root[data-ui="nova"] .hero h1 em{font-style:normal;font-weight:800;display:block}
:root[data-ui="nova"] .panel{border-radius:26px;background:var(--nx-glass)}
:root[data-ui="nova"][data-mode="light"] .panel{background:#fff;box-shadow:0 6px 22px rgba(70,40,120,.06)}

/* navigation façon pilule */
:root[data-ui="nova"] .bnav{display:flex;justify-content:space-between;align-items:center;gap:6px;border-radius:30px 30px 0 0;
  background:color-mix(in srgb,#140F1B 86%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 -10px 30px rgba(0,0,0,.25)}
:root[data-ui="nova"][data-mode="light"] .bnav{background:rgba(255,255,255,.82);box-shadow:inset 0 1px 0 #fff,0 -10px 30px rgba(70,40,120,.10)}
:root[data-ui="nova"] .bn{flex:0 0 auto;flex-direction:row;gap:10px;padding:0;color:var(--muted);border-radius:99px;transition:background .25s,padding .25s}
:root[data-ui="nova"] .bn .bi{width:48px;height:48px;border-radius:50%;background:var(--nx-glass-2)}
:root[data-ui="nova"] .bn .bl{display:none;font-size:15px;font-weight:700}
:root[data-ui="nova"] .bn.on{flex:1 1 auto;justify-content:flex-start;padding:4px 18px 4px 4px;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink)}
:root[data-ui="nova"][data-mode="light"] .bn.on{background:#1C1427;color:#fff}
:root[data-ui="nova"] .bn.on .bi{width:44px;height:44px;background:var(--nx-pill);color:#1C1427}
:root[data-ui="nova"] .bn.on .bl{display:block}
:root[data-ui="nova"] .bn.on svg{stroke-width:2.1}
@media (prefers-reduced-motion:reduce){.nx-it.next-up .nx-body{animation:none}}
</style>

<script>
const DAYS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const DAYS_LONG=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const FOCUS=["Fessiers","Dos & fessiers","Quadri & ischios","Haut du corps","Force","Hypertrophie","Cardio","Mobilité"];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};

function template(){
  const ex=(name,sets,reps,load,rest,note="")=>({id:uid(),name,sets,reps,load,rest,note});
  const F="Dernière série à l'échec";
  const glutes=day=>({id:uid(),name:"Bas du corps — fessiers",focus:"Fessiers",day,exercises:[
    ex("Mobilité hanches",1,"5 min","",0),
    ex("Hip thrust",4,"8","",90,F),
    ex("Leg press",4,"8","",90,F),
    ex("Fentes bulgares",3,"10","",75,"Dernière à l'échec, puis enchaîner 1 série sans poids"),
    ex("Soulevé de terre",4,"8","",120,F),
    ...(day===3?[ex("Abducteurs (fessiers extérieurs)",3,"échec","",60,"Chaque série jusqu'à l'échec")]:[]),
    ex("Back extension",3,"échec","",60,"Chaque série jusqu'à l'échec")]});
  return {tv:10,example:false,sessions:[
    {id:uid(),name:"Bas du corps — quadri & ischios",focus:"Quadri & ischios",day:1,exercises:[
      ex("Mobilité hanches",1,"10 min","",0),
      ex("Goblet squat",3,"8","",90,F),
      ex("Leg extension",4,"8","",75,F),
      ex("Leg curl",4,"8","",75,F),
      ex("Soulevé de terre focus ischios",3,"8","",120,F)]},
    {id:uid(),name:"Haut du corps",focus:"Haut du corps",day:2,exercises:[
      ex("Tirage horizontal",4,"8","",90,F),
      ex("Face pull (tirage visage)",4,"8","",75,F),
      ex("Biceps curl",4,"8","",60,F),
      ex("Triceps",4,"8","",60,F),
      ex("Shoulder press",3,"8","",90,F),
      ex("Back extension focus lombaires",3,"échec","",60,"Chaque série jusqu'à l'échec"),
      ex("Escaliers",1,"20 min","",0,"En fin de séance")]},
    glutes(3),
    saturday(),
    glutes(6),
  ],log:{},progress:{}};
}
// Circuit abdos : 3 tours, on enchaîne les 3 exercices puis repos
function absCircuit(){
  return [{id:uid(),name:"Circuit abdos",sets:3,reps:"",load:"",rest:60,
    note:"Enchaîner les 3 exercices sans pause, puis 1 min de repos avant le tour suivant",
    items:[{name:"Relevés de jambes",reps:"12"},{name:"Russian twist",reps:"10 / côté"},{name:"Planche",reps:"40 s"}]}];
}
// Séance courte du samedi : dos + fessiers, puis escaliers
function saturday(){
  const F="Dernière série à l'échec";
  const ex=(name,sets,reps,rest,note)=>({id:uid(),name,sets,reps,load:"",rest,note});
  return {id:uid(),name:"Mixte — dos & fessiers",focus:"Dos & fessiers",day:5,exercises:[
    ex("Rowing haltère unilatéral",3,"10 / bras",75,F),
    ex("Fentes bulgares",3,"10",75,F),
    ex("Kickback à la poulie",3,"10 / jambe",60,F),
    ...absCircuit(),
    ex("Escaliers",1,"20 min",0,"En fin de séance")]};
}
// Remplace l'ancien programme d'exemple par le programme personnel (une seule fois)
function migrate(x){
  let fresh0=false; if(!x||!(x.tv>=2)){x=template();fresh0=true}
  x.log??={};x.progress??={};
  if(x.tv===2){ // ajouts du 12/11 sans toucher aux modifications existantes
    const mk=(name,reps,note)=>({id:uid(),name,sets:name==="Escaliers"?1:3,reps,load:"",rest:name==="Escaliers"?0:60,note});
    const up=x.sessions.find(s=>/haut du corps/i.test(s.name));
    if(up&&!up.exercises.some(e=>/escalier/i.test(e.name))) up.exercises.push(mk("Escaliers","20 min","En fin de séance"));
    const thu=x.sessions.find(s=>s.day===3);
    if(thu&&!thu.exercises.some(e=>/abducteur/i.test(e.name))){
      const a=mk("Abducteurs (fessiers extérieurs)","échec","Chaque série jusqu'à l'échec");
      const i=thu.exercises.findIndex(e=>/^back extension$/i.test(e.name.trim()));
      i<0?thu.exercises.push(a):thu.exercises.splice(i,0,a);
    }
    x.tv=3;
  }
  if(x.tv===3){ // tirage bûcheron remplacé par le face pull
    x.sessions.forEach(s=>s.exercises.forEach(e=>{if(/b[uû]cheron/i.test(e.name))e.name="Face pull (tirage visage)"}));
    x.tv=4;
  }
  if(x.tv===4){ // nouvelle séance du samedi
    if(!x.sessions.some(s=>/dos & fessiers/i.test(s.name))){
      const sat=saturday(); if(x.sessions.some(s=>s.day===5)) sat.day=null; x.sessions.push(sat);
    }
    x.tv=5;
  }
  if(x.tv===5){ // tirage vertical remplacé
    x.sessions.forEach(s=>s.exercises.forEach(e=>{if(/^tirage vertical$/i.test(e.name.trim())){
      e.name="Pull-over à la poulie";e.reps="12";e.rest=75;e.note="Bras tendus. Dernière série à l'échec"}}));
    x.tv=6;
  }
  if(x.tv===6){ // pull-over remplacé par le rowing T-bar (épaisseur du dos)
    x.sessions.forEach(s=>s.exercises.forEach(e=>{if(/pull-over/i.test(e.name)){
      e.name="Rowing T-bar";e.reps="10";e.rest=90;e.note="Omoplates serrées 1 s en fin de mouvement. Dernière série à l'échec"}}));
    x.tv=7;
  }
  if(x.tv===7){ // rowing T-bar remplacé par un circuit abdos
    x.sessions.forEach(s=>{const i=s.exercises.findIndex(e=>/t-bar/i.test(e.name));if(i<0)return;
      s.exercises.splice(i,1);const j=s.exercises.findIndex(e=>/escalier/i.test(e.name));
      s.exercises.splice(j<0?s.exercises.length:j,0,...absCircuit())});
    x.tv=8;
  }
  if(x.tv===8){ // les 3 exercices d'abdos regroupés en un seul circuit
    x.sessions.forEach(s=>{const i=s.exercises.findIndex(e=>/^abdos \d/i.test(e.name));if(i<0)return;
      s.exercises=s.exercises.filter(e=>!/^abdos \d/i.test(e.name));s.exercises.splice(i,0,...absCircuit())});
    x.tv=9;
  }
  if(x.tv===9){ // samedi : step-up → fentes bulgares, kickback en 3 × 10
    x.sessions.forEach(s=>s.exercises.forEach(e=>{
      if(/step-up/i.test(e.name)){e.name="Fentes bulgares";e.reps="10";e.note="Dernière série à l'échec"}
      if(/kickback/i.test(e.name)){e.sets=3;e.reps="10 / jambe";e.note="Dernière série à l'échec"}}));
    x.tv=10;
  }
  if(x.tv===10){ // repos de 2 min partout
    x.sessions.forEach(s=>s.exercises.forEach(e=>{if(+e.rest>0)e.rest=120;
      if(e.items&&e.note)e.note=e.note.replace("1 min de repos","2 min de repos")}));
    x.tv=11; return {fresh:true,data:x};
  }
  return {fresh:fresh0,data:x};
}

let S=null, view={day:(new Date().getDay()+6)%7, edit:null, confirmDel:false}, timer=null, syncTxt="";
const monday=(()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d})();
const dateOf=i=>{const d=new Date(monday);d.setDate(d.getDate()+i);return d};
const todayIdx=(new Date().getDay()+6)%7;
const sessFor=i=>S.sessions.find(s=>s.day===i);
const fmtRest=s=>!s?"":s>=60?(s%60?`${Math.floor(s/60)} min ${s%60}`:`${s/60} min`):`${s} s`;

/* ---------- stockage ---------- */
const LS="carnet-seances-v1";
let dbRef=null, saveT=null;
function lsGet(){try{return JSON.parse(localStorage.getItem(LS))}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function save(){
  // garder seulement 3 semaines de coches
  const cut=iso(new Date(Date.now()-21*864e5));
  for(const k in S.progress) if(k.slice(0,10)<cut) delete S.progress[k];
  S.updatedAt=Date.now();
  lsSet();
  clearTimeout(saveT);
  if(!dbRef){setSync("Enregistré sur cet appareil");return}
  setSync("Enregistrement…");
  pending=true;
  saveT=setTimeout(flush,500);
}
// envoi immédiat (aussi quand l'appli passe en arrière-plan ou que le téléphone se verrouille)
let pending=false;
async function flush(){
  clearTimeout(saveT); if(!dbRef||!pending) return; pending=false;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)));setSync("Synchronisé")}
  catch(e){pending=true;setSync("Enregistré sur cet appareil")}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});
addEventListener("pagehide",flush);
// au retour sur l'appli, on renvoie ce qui n'aurait pas pu partir
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&pending)flush()});
var mode="dark";
function setMode(m){mode=["light","shonen","fight"].includes(m)?m:"dark";try{const f=document.getElementById("favicon"),t=document.getElementById("touchicon");if(f){f.href=logoFor()}if(t){t.href=logoFor()}}catch(e){}document.documentElement.dataset.mode=mode;document.documentElement.dataset.ui=(mode==="dark"||mode==="light")?"nova":"";try{localStorage.setItem("carnet-mode",mode)}catch(e){}}
function setSync(t){syncTxt=t;const el=document.getElementById("sync");if(el)el.textContent=t}

async function connect(){
  try{
    const db=await window.claude?.use?.("db"); const user=await window.claude?.use?.("user");
    if(!db||!user) {setSync("Enregistré sur cet appareil");return}
    const id=await user.id(); if(!id){setSync("Enregistré sur cet appareil");return}
    dbRef=db.collection("data/users/"+id).doc("programme");
    const snap=await dbRef.get();
    if(snap.exists){
      const m=migrate(snap.data()), local=lsGet();
      // si cet appareil a une version plus récente (modif faite juste avant de verrouiller), on la garde
      if(local&&local.updatedAt&&(!m.data.updatedAt||local.updatedAt>m.data.updatedAt)){S=migrate(local).data;render();save();return}
      S=m.data;if(S.mode)setMode(S.mode);applyName();render();if(m.fresh)save();else setSync("Synchronisé")}
    else save();
  }catch(e){setSync("Enregistré sur cet appareil")}
}

/* ---------- rendu ---------- */
function weekStats(){
  const planned=S.sessions.filter(s=>s.day!=null);
  let done=0; for(let i=0;i<7;i++){if(S.log[iso(dateOf(i))])done++}
  const sets=planned.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+(+e.sets||0),0),0);
  const mins=planned.reduce((a,s)=>a+minutes(s),0);
  return {planned:planned.length,done,sets,mins};
}
function render(){
  const app=document.getElementById("app");
  app.innerHTML = view.edit ? renderEditor() : renderMain();
}

function scallop(fill,label){
  // pastille douce : fleur de cercles arrondis, couleur adoucie
  if(SH()){ // pastille façon écusson : rond volt avec couture en pointillés
    return `<svg class="sticker burst" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36" fill="var(--sticker)" stroke="#0B1F14" stroke-width="2.5"/><circle cx="40" cy="40" r="29" fill="none" stroke="#0B1F14" stroke-width="1.6" stroke-dasharray="3 3" opacity=".55"/><text x="40" y="46" text-anchor="middle">${esc(label)}</text></svg>`;
  }

  // pastille simple : un rond plein
  return `<svg class="sticker" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="var(--sticker)"/><text x="40" y="45" text-anchor="middle">${esc(label)}</text></svg>`;
}
/* Mode Arcade : disposition « focus » — barre segmentée, exercice en cours mis en avant, les autres repliés */
function renderArcade(s,i,key,when,prog,total,doneSets,finished){
  const isDone=e=>(prog[e.id]||0)>=(+e.sets||0)&&+e.sets>0;
  const auto=s.exercises.find(e=>!isDone(e));
  const focusId=(view.focus&&view.focus[key]&&s.exercises.some(e=>e.id===view.focus[key]))?view.focus[key]:auto?.id;
  const left=Math.max(0,total-doneSets), minsLeft=Math.round(minutes(s)*(total?left/total:0));
  const seg=Array.from({length:total},(_,j)=>`<i class="${finished||j<doneSets?"on":""}"></i>`).join("");
  return `
    <div class="hero-top"><div class="label">${when}</div><button class="ghost" data-act="edit" data-id="${s.id}">Modifier</button></div>
    <h1>${titleHTML(s.name)}</h1>
    <div class="hud">
      <div class="hud-top"><span class="lbl">${finished?"Séance terminée":"Progression de ma séance"}</span><span class="num">${doneSets}/${total} séries</span></div>
      <div class="runbar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${doneSets}" style="--p:${finished?100:(total?doneSets/total*100:0)}%"><span class="fill"></span><span class="dot"></span></div>
      <div class="run-ends"><span>Départ</span><span>Arrivée</span></div>
      <div class="hud-stats num"><span><b>${s.exercises.filter(isDone).length}/${s.exercises.length}</b> exercices</span><span><b>${left}</b> séries restantes</span><span><b>≈ ${finished?0:minsLeft} min</b> restantes</span></div>
    </div>
    <h2 class="subtitle">Exercices du jour</h2>
    <div class="arc-list">${s.exercises.map((e,n)=>{
      const c=prog[e.id]||0,k=+e.sets||0,circ=e.items?.length,done=isDone(e);
      if(e.id!==focusId){
        return `<button class="arc-row ${done?"done":""}" data-act="focus" data-key="${key}" data-eid="${e.id}">
          <span class="idx num">${done?"✓":n+1}</span><span class="nm">${esc(e.name)}</span>
          <span class="mt num">${circ?`${k} tours`:once(e)?esc(e.reps):`${k} × ${esc(e.reps)}`}${e.load?` · ${esc(e.load)}`:""}${!done&&c?` · ${c}/${k}`:""}</span></button>`;
      }
      return `<div class="ex focus" id="ex-${e.id}" style="--card:var(--${PAL[n%PAL.length]})">
        <span class="idx num ${done?"ok":c>0?"go":""}">${done?"✓":n+1}</span>
        <div class="head"><h3>${esc(e.name)}</h3><span class="badge">${done?"✓ Fait":"En cours"}</span></div>
        <div class="spec num"><span class="main">${circ?`${k} tours`:once(e)?esc(e.reps):`${k} × ${esc(e.reps)}`}</span>${e.rest?`<span>repos ${fmtRest(+e.rest)}</span>`:""}</div>
        ${circ?`<ol class="items">${e.items.map(it=>`<li><span>${esc(it.name)}</span><b class="num">${esc(it.reps)}</b></li>`).join("")}</ol>`:""}
        ${circ||once(e)||/mobilit/i.test(e.name)||/\bmin\b/i.test(e.reps)?"":`<label class="load"><span>Charge</span><input class="load-in" data-load="${e.id}" data-sid="${s.id}" value="${esc(e.load)}" placeholder="ex. 40 kg" inputmode="text" autocomplete="off"></label>`}
        ${e.note?`<div class="note">${esc(e.note)}</div>`:""}
        <div class="sets big">${once(e)?`<button class="done-btn ${c>=1?"on":""}" data-act="set" data-sid="${s.id}" data-eid="${e.id}" data-j="0" aria-pressed="${c>=1}">${c>=1?"✓ C'est fait":"C'est fait"}</button>`:Array.from({length:k},(_,j)=>`<button class="set num ${j<c?"on":""}" data-act="set" data-sid="${s.id}" data-eid="${e.id}" data-j="${j}" aria-label="${circ?"Tour":"Série"} ${j+1}">${j+1}</button>`).join("")}</div>
      </div>`}).join("")}</div>
    <div class="cta">${finished
      ?`<button class="primary ok" data-act="finish" data-id="${s.id}">Séance terminée <i>✓</i></button>`
      :`<button class="primary" data-act="finish" data-id="${s.id}">Terminer la séance <i>→</i></button>`}</div>`;
}
const isCardio=e=>e.type==="cardio"||(e.type==null&&!e.items?.length&&(+e.sets||0)<=1&&/\bmin\b/i.test(e.reps||"")&&!/mobilit/i.test(e.name));
const once=e=>isCardio(e)||((+e.sets||0)<=1&&!e.items?.length&&(/mobilit/i.test(e.name)||/\bmin\b/i.test(e.reps||"")));
function titleHTML(name){const [a,...b]=String(name).split(/\s+[—–-]\s+/);return esc(a)+(b.length?`<em>${esc(b.join(" "))}</em>`:"")}
function renderMain(){
  const st=weekStats();
  const week=DAYS.map((d,i)=>{
    const s=sessFor(i), date=dateOf(i), done=S.log[iso(date)];
    return `<button class="day ${s?"has":""} ${done?"done":""} ${i===todayIdx?"today":""} ${i===view.day?"sel":""}" data-act="day" data-i="${i}" aria-label="${DAYS_LONG[i]} ${date.getDate()}${s?", "+esc(s.name):""}">
      ${done?`<span class="chk" aria-hidden="true">✓</span>`:""}<b class="num">${date.getDate()}</b><small>${d}</small></button>`}).join("");
  const h=`${Math.floor(st.mins/60)} h ${String(st.mins%60).padStart(2,"0")}`;
  return `
  ${NOVA()?novaHeader():`<header><div class="brand"><img src="${logoFor()}" alt="" width="38" height="38"><span class="app-title">${esc(appName())}</span></div><span class="sync" id="sync">${esc(syncTxt)}</span></header>`}
  ${view.tab==="hist"?renderHistory():view.tab==="set"?renderSettings():view.tab==="prog"?renderProgram():`
  ${NOVA()?`<section class="nw-sec">${novaWeek()}</section>`:`<section>
    <div class="week">${week}</div>
    <div class="stats num"><span><strong>${st.done}/${st.planned}</strong> séances faites</span><span><strong>${st.sets}</strong> séries</span><span><strong>${h}</strong> cette semaine</span></div>
  </section>`}
  <section class="hero">${renderDay()}</section>
  `}
  ${bottomNav()}`;
}

/* ---------- historique ---------- */
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const kg=v=>{const m=String(v||"").replace(",",".").match(/\d+(\.\d+)?/);return m?+m[0]:null};
// photo de la séance d'un jour : séries faites, total, charges notées, validée ou non
function snap(dk,s){
  if(!s) return;
  S.hist??={};
  const p=S.progress[dk+"|"+s.id]||{};
  const total=s.exercises.reduce((a,e)=>a+(+e.sets||0),0);
  const done=s.exercises.reduce((a,e)=>a+Math.min(p[e.id]||0,+e.sets||0),0);
  const loads={};s.exercises.forEach(e=>{const v=kg(e.load);if(v!=null&&(p[e.id]||0)>0)loads[e.name]=v});
  if(!done&&!S.log[dk]){delete S.hist[dk];return}
  S.hist[dk]={sid:s.id,name:s.name,done,total,loads,ok:S.log[dk]===s.id};
}
function histData(){return view.histDemo?demoHist():(S.hist||{})}
function plannedOn(d){const wd=(d.getDay()+6)%7;return S.sessions.find(x=>x.day===wd)}
function monthStats(H,y,m){
  const days=new Date(y,m+1,0).getDate(), today=iso(new Date());
  let planned=0,done=0,full=0,sets=0;const cells=[];
  for(let d=1;d<=days;d++){
    const dt=new Date(y,m,d,12), k=iso(dt), h=H[k], pl=plannedOn(dt), past=k<=today;
    if(pl&&past)planned++;
    if(h){if(h.ok||h.done>=h.total)done++;if(h.total&&h.done>=h.total)full++;sets+=h.done}
    cells.push({d,k,h,pl:!!pl,past,wd:(dt.getDay()+6)%7});
  }
  // semaines complètes : toutes les séances prévues de la semaine faites (semaines du lundi dans ce mois)
  let weeks=0,weeksTot=0;const nPl=S.sessions.filter(x=>x.day!=null).length;
  for(let d=1;d<=days;d++){const dt=new Date(y,m,d,12);if((dt.getDay()+6)%7!==0)continue;
    const end=new Date(dt);end.setDate(end.getDate()+6);if(iso(end)>today)continue;weeksTot++;
    let c=0;for(let k=0;k<7;k++){const x=new Date(dt);x.setDate(x.getDate()+k);const h=H[iso(x)];if(h&&(h.ok||h.done>=h.total))c++}
    if(nPl&&c>=nPl)weeks++}
  return {planned,done,full,sets,weeks,weeksTot,cells};
}
function loadSeries(H){
  const by={};Object.keys(H).sort().forEach(k=>{const L=H[k].loads||{};for(const n in L)(by[n]??=[]).push({k,v:L[n]})});
  return by;
}
function spark(pts,w=120,h=34){
  if(pts.length<2) return "";
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;
  const xy=pts.map((p,i)=>[4+i*(w-8)/(pts.length-1),h-4-(p.v-mn)/r*(h-8)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${xy.map(a=>a.map(n=>n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${xy.at(-1)[0].toFixed(1)}" cy="${xy.at(-1)[1].toFixed(1)}" r="3.2" fill="currentColor"/></svg>`;
}
function renderHistory(){
  const H=histData(), now=new Date(), off=view.histOff||0;
  const ref=new Date(now.getFullYear(),now.getMonth()+off,1), y=ref.getFullYear(), m=ref.getMonth();
  const st=monthStats(H,y,m), empty=!Object.keys(H).length;
  // 6 derniers mois
  const months=Array.from({length:6},(_,i)=>{const d=new Date(y,m-5+i,1);return {lbl:MOIS[d.getMonth()].slice(0,3),...monthStats(H,d.getFullYear(),d.getMonth())}});
  const mx=Math.max(1,...months.map(x=>Math.max(x.done,x.planned)));
  const first=(new Date(y,m,1).getDay()+6)%7;
  const cal=`${"LMMJVSD".split("").map(d=>`<span class="cal-h">${d}</span>`).join("")}${"<span></span>".repeat(first)}${st.cells.map(c=>{
    const cls=c.h?(c.h.total&&c.h.done>=c.h.total?"full":c.h.ok?"ok":"part"):(c.pl&&c.past?"miss":"");
    return `<span class="cal-d ${cls}" title="${c.d} ${MOIS[m]}${c.h?" : "+esc(c.h.name)+" ("+c.h.done+"/"+c.h.total+" séries)":""}">${c.d}</span>`}).join("")}`;
  // charges : variation sur le mois choisi par rapport au début de l'historique
  const LS=loadSeries(H), mk=`${y}-${String(m+1).padStart(2,"0")}`;
  const rows=Object.entries(LS).map(([n,pts])=>{
    const inM=pts.filter(p=>p.k.startsWith(mk)), before=pts.filter(p=>p.k<mk+"-01");
    if(!inM.length) return null;
    const start=(before.at(-1)||inM[0]).v, end=inM.at(-1).v, d=+(end-start).toFixed(1);
    return {n,pts:pts.filter(p=>p.k<=mk+"-31").slice(-10),end,d};
  }).filter(Boolean).sort((a,b)=>b.d-a.d);
  return `
  <section class="hist">
    ${mode==="fight"?fightStats():""}
    ${empty&&!view.histDemo?`<div class="hist-empty"><b>Votre historique se remplit tout seul.</b><p>Chaque série cochée, chaque charge notée et chaque séance validée sont enregistrées jour par jour. Revenez ici après vos premières séances pour voir votre progression mois par mois.</p><button class="ghost" data-act="demo">Voir un aperçu avec des données d'exemple</button></div>`:""}
    ${view.histDemo?`<div class="demo-note">Aperçu avec des données d'exemple, pas vos séances. <button data-act="demo">Revenir à mon historique</button></div>`:""}
    <div class="month-nav"><button class="icon" data-act="hmon" data-d="-1" aria-label="Mois précédent">‹</button><h2>${MOIS[m][0].toUpperCase()+MOIS[m].slice(1)} ${y}</h2><button class="icon" data-act="hmon" data-d="1" aria-label="Mois suivant" ${off>=0?"disabled":""}>›</button></div>
    <div class="kpis num">
      <div class="kpi"><b>${st.done}<small>/${st.planned}</small></b><span>séances faites</span></div>
      <div class="kpi"><b>${st.full}</b><span>séances complètes</span></div>
      <div class="kpi"><b>${st.weeks}<small>/${st.weeksTot}</small></b><span>semaines complètes</span></div>
      <div class="kpi"><b>${st.sets}</b><span>séries réalisées</span></div>

function demoHist(){
  const H={},now=new Date();let x=7;const rnd=()=>(x=(x*16807)%2147483647)/2147483647;
  const base={"Hip thrust":60,"Leg press":110,"Soulevé de terre":50,"Tirage horizontal":35,"Shoulder press":12};
  for(let back=170;back>=0;back--){const d=new Date(now);d.setDate(d.getDate()-back);const s=plannedOn(d);if(!s||rnd()<.18)continue;
    const total=s.exercises.reduce((a,e)=>a+(+e.sets||0),0),done=rnd()<.7?total:Math.floor(total*(.5+rnd()*.4));

}

  {lv:34,name:"Mari",         aura:"#FF4D6D", glow:"rgba(255,77,109,.85)"}];
function fullWeeks(H){
  const keys=Object.keys(H).sort(); if(!keys.length) return 0;
  const nPl=S.sessions.filter(x=>x.day!=null).length; if(!nPl) return 0;
  const d=new Date(keys[0]+"T12:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7));
  const today=iso(new Date()); let n=0;
  for(;iso(d)<=today;d.setDate(d.getDate()+7)){let c=0;for(let k=0;k<7;k++){const x=new Date(d);x.setDate(x.getDate()+k);const h=H[iso(x)];if(h&&(h.ok||h.done>=h.total))c++}if(c>=nPl)n++}
  return n;
}
function xpData(){
  const H=S.hist||{};let xp=0,sessions=0,full=0,sets=0;
  for(const k in H){const h=H[k];sets+=h.done;xp+=h.done*10;if(h.ok||(h.total&&h.done>=h.total)){sessions++;xp+=50}if(h.total&&h.done>=h.total)full++}
  const weeks=fullWeeks(H);xp+=weeks*150;xp+=(S.journal||[]).filter(j=>j.t==="record").length*30;
  let lv=1,need=120,cur=xp;while(cur>=need){cur-=need;lv++;need=120+lv*30}
  const tier=[...TIERS].reverse().find(t=>lv>=t.lv), next=TIERS.find(t=>t.lv>lv);
  return {xp,lv,cur,need,tier,next,sessions,full,sets,weeks,power:xp*8+lv*250};
}

function bestLoads(){

  S.best={};const LS=loadSeries(S.hist||{});for(const n in LS)S.best[n]=Math.max(...LS[n].map(p=>p.v));
  return S.best;
}
function checkRecord(e){
  const v=kg(e.load);if(v==null)return;
  const B=bestLoads(),prev=B[e.name];
  if(prev==null){B[e.name]=v;save();return}
  if(v>prev){B[e.name]=v;S.journal??=[];S.journal.push({t:"record",d:iso(new Date()),ex:e.name,o:prev,n:v});save();
    if(mode==="fight"){recordScene(e.name,prev,v);render()}}
}

function journalEntries(){
  const H=S.hist||{},out=[];
  const done=Object.keys(H).sort().filter(k=>H[k].ok||(H[k].total&&H[k].done>=H[k].total));
  if(done.length) out.push({d:done[0],t:"start",h:"Le voyage commence",p:`Première séance validée : ${H[done[0]].name}. Le premier pas d'un long entraînement.`});
  // semaines parfaites
  const nPl=S.sessions.filter(x=>x.day!=null).length;
  if(nPl&&done.length){const d=new Date(done[0]+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));const today=iso(new Date());
    for(;iso(d)<=today;d.setDate(d.getDate()+7)){let c=0,last=null;for(let k=0;k<7;k++){const x=new Date(d);x.setDate(x.getDate()+k);const h=H[iso(x)];if(h&&(h.ok||h.done>=h.total)){c++;last=iso(x)}}
      if(c>=nPl)out.push({d:last,t:"week",h:"Semaine parfaite",p:`${c} séances sur ${c}. Aucune n'a été laissée de côté.`})}}
  (S.journal||[]).forEach(j=>{
    if(j.t==="record")out.push({d:j.d,t:"record",h:`Record : ${j.ex}`,p:`La barre monte de ${fmtKg(j.o)} à ${fmtKg(j.n)}. Le corps s'est adapté, la force grandit.`});
    if(j.t==="tier")out.push({d:j.d,t:"tier",h:`Transformation · ${TIERS[tierIdx(j.lv)].name}`,p:`Niveau ${j.lv} atteint. Une nouvelle aura s'éveille autour du combattant.`});
  });
  out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  return out.map((e,i)=>({...e,ch:i+1})).reverse();
}

function puffs(w,h,n,seed,band,x0=0){
  let x=seed;const rnd=()=>(x=(x*16807)%2147483647)/2147483647;
  const P=[];for(let i=0;i<n;i++)P.push({cx:x0+rnd()*w,cy:band[0]+rnd()*(band[1]-band[0]),r:28+rnd()*52});
  P.sort((a,b)=>a.cy-b.cy);
  return P.map(p=>`<circle cx="${(p.cx+p.r*.12).toFixed(0)}" cy="${(p.cy+p.r*.16).toFixed(0)}" r="${p.r.toFixed(0)}" fill="#B9D8F2"/>
    <circle cx="${p.cx.toFixed(0)}" cy="${p.cy.toFixed(0)}" r="${(p.r*.94).toFixed(0)}" fill="#FFFFFF"/>
    <path d="M${(p.cx-p.r*.55).toFixed(0)} ${(p.cy-p.r*.25).toFixed(0)} q${(p.r*.25).toFixed(0)} ${(-p.r*.45).toFixed(0)} ${(p.r*.7).toFixed(0)} ${(-p.r*.45).toFixed(0)} q${(-p.r*.4).toFixed(0)} ${(p.r*.12).toFixed(0)} ${(-p.r*.7).toFixed(0)} ${(p.r*.45).toFixed(0)}z" fill="#FFF6E0"/>`).join("");
}

/* ---------- minuteur ---------- */
let actx=null;
function beep(){try{actx??=new (window.AudioContext||window.webkitAudioContext)();
  [0,.22,.44].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i===2?1040:780;o.connect(g);g.connect(actx.destination);
    const t=actx.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}}
function startTimer(sec,label,info){
  clearInterval(timer?.iv); if(!sec){hideTimer();return}
  try{actx??=new (window.AudioContext||window.webkitAudioContext)();actx.resume?.()}catch(e){}
  timer={end:Date.now()+sec*1000,total:sec,label,info,beeped:false,over:null};
  const C=2*Math.PI*85, el=document.getElementById("timer");
  // la pop-up est construite une seule fois, seuls le texte et l'anneau changent ensuite
  el.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="Minuteur de repos">
    <div class="what" id="tm-what"></div>
    <div class="ex-name">${esc(label)}</div>
    <div class="clock"><svg viewBox="0 0 190 190"><circle class="bgc" cx="95" cy="95" r="85"/><circle class="fg" id="tm-ring" cx="95" cy="95" r="85" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0"/></svg>
      <div class="t" id="tm-t"></div></div>
    <div class="btns" id="tm-btns"></div>
  </div>`;
  el.className="timer"+(SH()?" delay":""); el.hidden=false; tickTimer(); timer.iv=setInterval(tickTimer,250);
}
function tickTimer(){
  if(!timer) return;
  const el=document.getElementById("timer");
  const left=Math.ceil((timer.end-Date.now())/1000), over=left<=0, a=Math.abs(left);
  if(over&&!timer.beeped){timer.beeped=true;beep()}
  const C=2*Math.PI*85, frac=over?0:Math.max(0,Math.min(1,left/timer.total));
  document.getElementById("tm-t").textContent=over?"0:00":Math.floor(a/60)+":"+String(a%60).padStart(2,"0");
  document.getElementById("tm-ring").setAttribute("stroke-dashoffset",(C*(1-frac)).toFixed(1));
  if(timer.over!==over){
    timer.over=over;
    el.classList.toggle("over",over);
    document.getElementById("tm-what").textContent=over?"C'est reparti !":"Repos · "+timer.info;
    document.getElementById("tm-btns").innerHTML=over?`<button class="go" data-act="skip">Série suivante</button>`
      :`<button data-act="tminus" aria-label="Retirer 15 secondes">−15 s</button><button class="go" data-act="skip">Passer</button><button data-act="tplus" aria-label="Ajouter 15 secondes">+15 s</button>`;
  }
  if(left<-20) hideTimer();
}

  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="day"){view.sheet=null;view.day=+b.dataset.i;render();return}

    if(next>c&&next>=(+e.sets||0)) goNext(s,e);

    return}

  if(a==="addrun"){s.exercises.push({id:uid(),type:"cardio",name:"Course",sets:1,reps:"30 min",load:"",rest:0,note:""});save();render();return}
  if(a==="extype"){const e=s.exercises[idx];if(!e)return;const toC=b.dataset.ty==="cardio";if(toC===isCardio(e))return;
    if(toC){e._m={sets:e.sets,reps:e.reps,load:e.load,rest:e.rest};Object.assign(e,{type:"cardio",sets:1,reps:/\bmin\b/i.test(e.reps||"")?e.reps:"30 min",load:"",rest:0})}

  if(a==="additem"){s.exercises[idx].items.push({name:"Exercice",reps:"10"});save();render();return}

const nxi=(k,w=1.9)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NXI[k]}</svg>`;
function novaHeader(){
  const h=new Date().getHours(), hello=h<5||h>=18?"Bonsoir":"Bonjour";
  const s=view.tab==="week"||!view.tab?sessFor(view.day):null;
  return `<header class="nh"><div class="nh-l"><img class="nh-av" src="${logoFor()}" alt="" width="46" height="46"><div class="nh-t"><small>${hello} !</small><span class="app-title">${esc(appName())}</span></div></div>
    <div class="nh-r"><span class="sync" id="sync">${esc(syncTxt)}</span>${s?`<button class="nh-b" data-act="edit" data-id="${s.id}" aria-label="Modifier la séance">${nxi("pen")}</button>`:""}</div></header>`;
}
function novaWeek(){
  const d0=dateOf(0), d6=dateOf(6), m=d=>d.toLocaleDateString("fr-FR",{month:"long"});
  const range=m(d0)===m(d6)?`${m(d0)} ${d0.getFullYear()}`:`${m(d0).slice(0,4)}. – ${m(d6).slice(0,4)}. ${d6.getFullYear()}`;
  const st=weekStats();
  return `<div class="nw-top"><h2 class="nw-title"><span>Ma</span> <b>semaine</b></h2><span class="nw-range">${range[0].toUpperCase()+range.slice(1)}</span></div>
  <div class="nw">${DAYS.map((d,i)=>{const s=sessFor(i),date=dateOf(i),done=S.log[iso(date)];
    return `<button class="nw-d ${s?"has":""} ${done?"done":""} ${i===todayIdx?"today":""} ${i===view.day?"sel":""}" data-act="day" data-i="${i}" aria-label="${DAYS_LONG[i]} ${date.getDate()}${s?", "+esc(s.name):", repos"}${done?", faite":""}" aria-pressed="${i===view.day}"><small>${d.slice(0,1)}</small><b class="num">${date.getDate()}</b><i aria-hidden="true"></i></button>`}).join("")}</div>
  <div class="nw-stats num"><span><b>${st.done}/${st.planned}</b> séances</span><span><b>${st.sets}</b> séries</span><span><b>${Math.floor(st.mins/60)} h ${String(st.mins%60).padStart(2,"0")}</b> d'effort</span></div>`;
}
function novaDay(s,i,key,when,prog,total,doneSets,finished,pct){
  const exDone=e=>{const c=prog[e.id]||0,k=+e.sets||0;return k>0&&c>=k};
  const nDone=s.exercises.filter(exDone).length, nowId=finished?null:(s.exercises.find(e=>!exDone(e))||{}).id;
  const started=doneSets>0;
  const plan=s.exercises.slice(0,3).map(e=>`<li class="${exDone(e)?"ok":""}"><span class="nx-cb">${exDone(e)?nxi("check",2.6):""}</span><span class="nx-pt"><b>${esc(e.name)}</b><small class="num">${e.items?.length?`${+e.sets||0} tours`:once(e)?esc(e.reps):`${+e.sets||0} × ${esc(e.reps)}`}</small></span></li>`).join("");
  const more=s.exercises.length-3;
  const C=2*Math.PI*26;
  return `
  <div class="nx-grid">
    <div class="nx-card nx-peach nx-plan">
      <div class="nx-ch"><b>Au<br>programme</b><span class="nx-ic">${nxi(/cardio/i.test(s.focus)?"run":"db",2.1)}</span></div>
      <ul>${plan}</ul>${more>0?`<span class="nx-more">+ ${more} autre${more>1?"s":""}</span>`:""}
    </div>
    <div class="nx-card nx-lav nx-start">
      <small class="nx-date">${when}</small>
      <h1>${titleHTML(s.name)}</h1>
      ${finished?`<span class="nx-go done">Terminée <i>${nxi("check",2.6)}</i></span>`:`<button class="nx-go" data-act="nxgo">${started?"Reprendre":"Commencer"} <i>${nxi("play")}</i></button>`}
    </div>
  </div>
  <div class="nx-prog">
    <span class="nx-pi">${nxi(/cardio/i.test(s.focus)?"run":"db",2.1)}</span>
    <div class="nx-pt"><b>${finished?"Séance terminée":"Progression de ma séance"}</b><small class="num">${nDone} sur ${s.exercises.length} exercices · ≈ ${minutes(s)} min</small></div>
    <svg class="nx-ring" viewBox="0 0 64 64" role="img" aria-label="${pct} % de la séance"><circle cx="32" cy="32" r="26" class="bg"/><circle cx="32" cy="32" r="26" class="fg" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="36.5" text-anchor="middle" class="num">${pct}%</text></svg>
  </div>
  <div class="nx-h"><h2>Exercices <b>du jour</b></h2><span class="num">${nDone}/${s.exercises.length}</span></div>
  <div class="nx-tl">${s.exercises.map((e,n)=>{
    const c=prog[e.id]||0,k=+e.sets||0,circ=e.items?.length,comp=exDone(e),now=e.id===nowId;
    return `<div class="nx-it ${comp?"ok":""} ${now?"now":""}" id="ex-${e.id}" style="--acc:var(--nx-${NXC[n%NXC.length]})">
      <span class="nx-dot num" aria-hidden="true">${comp?nxi("check",2.8):n+1}</span>
      <div class="nx-body">
        <div class="nx-top"><h3>${esc(e.name)}</h3>${now?`<span class="nx-now">${c>0?"En cours":"À suivre"}</span>`:comp?`<span class="nx-fait">Fait</span>`:""}</div>
        <div class="nx-meta num"><span>${circ?`${k} tours`:once(e)?esc(e.reps):`${k} × ${esc(e.reps)}`}</span>${e.rest&&!isCardio(e)?`<span>repos ${fmtRest(+e.rest)}</span>`:""}${e.load&&!once(e)?`<span>${esc(e.load)}</span>`:""}</div>
        ${circ?`<ol class="nx-items">${e.items.map(it=>`<li><span>${esc(it.name)}</span><b class="num">${esc(it.reps)}</b></li>`).join("")}</ol>`:""}
        ${circ||once(e)||/mobilit/i.test(e.name)||/\bmin\b/i.test(e.reps)?"":`<label class="nx-load"><span>Charge</span><input class="load-in" data-load="${e.id}" data-sid="${s.id}" value="${esc(e.load)}" placeholder="ex. 40 kg" inputmode="text" autocomplete="off"></label>`}
        ${e.note?`<p class="nx-note">${esc(e.note)}</p>`:""}
        <div class="nx-sets">${once(e)?`<button class="nx-done ${c>=1?"on":""}" data-act="set" data-sid="${s.id}" data-eid="${e.id}" data-j="0" aria-pressed="${c>=1}">${c>=1?`${nxi("check",2.6)} C'est fait`:"C'est fait"}</button>`
          :Array.from({length:k},(_,j)=>`<button class="nx-set num ${j<c?"on":""}" data-act="set" data-sid="${s.id}" data-eid="${e.id}" data-j="${j}" aria-pressed="${j<c}" aria-label="${circ?"Tour":"Série"} ${j+1}">${j<c?nxi("check",2.8):j+1}</button>`).join("")}</div>
      </div>
    </div>`}).join("")}</div>
  <div class="cta nx-cta">${finished
    ?`<button class="nx-fin ok" data-act="finish" data-id="${s.id}">Séance terminée <i>${nxi("check",2.6)}</i></button>`
    :`<button class="nx-fin" data-act="finish" data-id="${s.id}">Terminer la séance <i>${nxi("arrow",2.2)}</i></button>`}</div>`;
}
document.addEventListener("click",e=>{if(!e.target.closest('[data-act="nxgo"]'))return;
  const el=document.querySelector(".nx-it.now")||document.querySelector(".nx-cta");if(!el)return;
  el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("next-up");void el.offsetWidth;el.classList.add("next-up")});

/* ---------- démarrage ---------- */
S=migrate(lsGet()).data;
setMode(S.mode||(()=>{try{return localStorage.getItem("carnet-mode")}catch(e){return null}})()||"dark");
drawSmoke();applyName();
setSync("Enregistré sur cet appareil");
render(); connect();

document.addEventListener("click",e=>{const b=e.target.closest(".rw-more");if(!b)return;const r=b.parentElement.querySelector(".rewards");r&&r.scrollBy({left:r.clientWidth*.7,behavior:"smooth"})});
document.addEventListener("scroll",e=>{const r=e.target;if(!(r instanceof Element)||!r.classList.contains("rewards"))return;const b=r.parentElement.querySelector(".rw-more");b&&b.classList.toggle("end",r.scrollLeft+r.clientWidth>=r.scrollWidth-4)},true);

/* ---------- sauvegarde (version installée hors Claude) ---------- */
function backupPanel(){return `<div class="panel">
       <div class="label">Sauvegarde</div>
       <p class="muted small">Exporte une sauvegarde de tes séances pour la garder au chaud, ou pour les transférer vers un autre téléphone ou vers l'appli installée.</p>
       <div class="bk-row"><button type="button" class="bk-btn" id="bk-exp">Exporter mes données</button><label class="bk-btn ghost">Importer une sauvegarde<input type="file" id="bk-imp" accept="application/json,.json" hidden></label></div>
       <p class="muted small" id="bk-msg" role="status"></p>
     </div>`}
document.addEventListener("click",async e=>{
  if(!e.target.closest("#bk-exp"))return;
  const name=`mes-seances-${iso(new Date())}.json`, blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const msg=document.getElementById("bk-msg");
  if(window.claude){try{const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:JSON.stringify(S,null,1)});if(msg)msg.textContent="Sauvegarde exportée.";return}}catch(err){if(msg)msg.textContent="Export annulé.";return}}
  try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Sauvegarde Mes séances"});if(msg)msg.textContent="Sauvegarde exportée.";return}}catch(err){if(err&&err.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  if(msg)msg.textContent="Sauvegarde téléchargée.";
});
document.addEventListener("change",e=>{
  if(e.target.id!=="bk-imp")return;const file=e.target.files&&e.target.files[0];if(!file)return;
  const rd=new FileReader();rd.onload=()=>{const msg=document.getElementById("bk-msg");
    try{const x=JSON.parse(rd.result);if(!x||!Array.isArray(x.sessions))throw 0;S=migrate(x).data;if(S.mode)setMode(S.mode);applyName();save();render();win("Données importées")}
    catch(err){if(msg)msg.textContent="Ce fichier n'est pas une sauvegarde valide."}};
  rd.readAsText(file);
});
</script>

<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
