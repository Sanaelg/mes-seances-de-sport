<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes séances</title>
<meta name="description" content="Mes séances de sport, mon programme et ma progression.">
<meta name="theme-color" content="#11121E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes séances">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300..900;1,300..700&family=Bangers&family=Bowlby+One&family=Chakra+Petch:wght@500;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Layout : une colonne ; jours en pastilles rondes, carte de progression lavande, exercices en cartes pastel sur fond sombre */
:root{
  /* palette pervenche / citron vert / violet / blanc, texte noir */
  --bg:#11121E; --surface:#1C1E31; --surface-2:#272A43; --ink:#EEF0FB; --muted:#A6ABCC; --line:#2F3352;
  --c1:#DDF58A; --c2:#9479F2; --c3:#BAC4EE; --yellow:#DDF58A; --pink:#DDF58A; --sage:#BAC4EE; --lav:#9479F2; --peach:#9479F2; --mint:#DDF58A; --coral:#9479F2; --ever:#111111;
  --burst:rgba(17,17,17,.75);
  --on:#111111; --on-soft:rgba(17,17,17,.7); --on-faint:rgba(17,17,17,.1);
  --accent:var(--yellow); --done:var(--mint); --danger:#FF8A80;
  --display:"Urbanist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Urbanist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --btn:#DDF58A; --btn-ink:#111111; --sticker:#DDF58A;
  --r:26px; color-scheme:dark;
}
:root[data-mode="light"]{
  --bg:#C3CBF0; --surface:#F7F8FD; --surface-2:#E3E7F8; --ink:#111111; --muted:#4B5070; --line:rgba(17,17,17,.1);
  --c3:#FFFFFF; --sage:#FFFFFF;
  --btn:#111111; --btn-ink:#DDF58A; --danger:#C93A30; color-scheme:light;
}
:root[data-mode="light"] .day.has small::after{background:#7A5BEA}
/* bloc progression : violet un peu plus profond, texte clair pour bien ressortir */
:root:not([data-mode="shonen"]) .progress{--on:#F4F2FF;--on-soft:rgba(244,242,255,.82);--on-faint:rgba(244,242,255,.2);background:#7C5CEB}
:root[data-mode="light"] .ex{box-shadow:inset 0 0 0 1px var(--line)}
:root[data-mode="light"] .day:not(.today):not(.sel){box-shadow:inset 0 0 0 1px var(--line)}
:root[data-mode="light"] .ex,:root[data-mode="light"] .progress{box-shadow:0 1px 0 rgba(20,20,24,.06)}
.hdr-r{display:flex;align-items:center;gap:10px}
.modes{display:flex;gap:2px;padding:3px;border-radius:99px;background:var(--surface)}
.mode{width:34px;height:34px;border-radius:50%;color:var(--muted);display:grid;place-items:center;transition:background .15s,color .15s}
.mode:hover{color:var(--ink)}
.mode.on{background:var(--lav);color:var(--on)}
.mode svg{width:17px;height:17px}
@media (max-width:400px){.sync{display:none}}

/* Mode Stade : terrain de nuit, projecteurs, piste d'athlétisme, typo maillot */
:root[data-mode="shonen"]{
  --bg:#06120C; --surface:rgba(16,38,26,.82); --surface-2:rgba(28,58,40,.92); --ink:#F2F6EF; --muted:#A9C2B1; --line:rgba(242,246,239,.12);
  --c1:#F2F6EF; --c2:#D7FF3A; --c3:#E8643F; --yellow:#D7FF3A; --pink:#D7FF3A; --lav:#D7FF3A; --peach:#0F2A1C; --mint:#D7FF3A; --ever:#0B1F14;
  --track:#C9553A; --pitch:#1C6B3F; --sticker:#D7FF3A;
  --on:#0B1F14; --on-soft:rgba(11,31,20,.72); --on-faint:rgba(11,31,20,.1);
  --btn:#D7FF3A; --btn-ink:#0B1F14; --danger:#FF7A6B; --r:18px; color-scheme:dark;
  --pixel:"Barlow Condensed","Urbanist",system-ui,sans-serif;
  --puff-shade:#C9553A; --puff-base:#D7FF3A; --puff-hl:#F2F6EF;
}
/* pelouse tondue en bandes + lueur des projecteurs */
:root[data-mode="shonen"] body{background:
  radial-gradient(80% 35% at 50% 0%,rgba(215,255,58,.06),transparent 70%),
  repeating-linear-gradient(180deg,rgba(255,255,255,.012) 0 56px,transparent 56px 112px),
  linear-gradient(180deg,#081A11 0%,#0B2417 45%,#0E2C1C 100%)}
:root[data-mode="shonen"] body::before{background:#081A11}
:root[data-mode="shonen"] h1,:root[data-mode="shonen"] h2.subtitle,:root[data-mode="shonen"] .ex h3,:root[data-mode="shonen"] .progress .big,:root[data-mode="shonen"] .brand,:root[data-mode="shonen"] .arc-row .nm{
  font-family:"Barlow Condensed","Urbanist",system-ui,sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
:root[data-mode="shonen"] h1{font-size:clamp(38px,9.5vw,58px);line-height:.9;color:var(--ink)}
:root[data-mode="shonen"] h1 em{font-style:italic;font-weight:800;color:var(--c2)}
:root[data-mode="shonen"] h2.subtitle{font-size:clamp(24px,6vw,30px);font-weight:700;color:var(--ink);display:flex;align-items:center;gap:12px}
:root[data-mode="shonen"] h2.subtitle::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
:root[data-mode="shonen"] .label{font-family:var(--pixel);font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--c2)}
:root[data-mode="shonen"] .stats strong{color:var(--c2)}
:root[data-mode="shonen"] .day{border-radius:10px}
:root[data-mode="shonen"] .day b{font-family:var(--pixel);font-weight:700;font-size:22px}
:root[data-mode="shonen"] .day.sel{background:var(--pitch);box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 0 0 1.5px var(--c2)}
:root[data-mode="shonen"] .day.sel b{color:#FFFFFF}
:root[data-mode="shonen"] .day.sel small{color:rgba(255,255,255,.75)}
:root[data-mode="shonen"] .ex{background-color:var(--card);border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
:root[data-mode="shonen"] .ex h3{font-size:clamp(26px,6.6vw,32px);line-height:.95}
/* numéro façon maillot */
:root[data-mode="shonen"] .ex .idx{width:auto;height:auto;background:none;color:var(--on);font-family:var(--pixel);font-weight:800;font-style:italic;font-size:34px;line-height:.9;margin-top:-2px;box-shadow:none;opacity:.9}
:root[data-mode="shonen"] .ex .idx.go{background:none;color:var(--track);box-shadow:none}
:root[data-mode="shonen"] .ex .idx.ok{background:none;color:var(--pitch);box-shadow:none;transform:none}
:root[data-mode="shonen"] .badge{font-family:var(--pixel);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;border-radius:4px}
:root[data-mode="shonen"] .set{border-radius:10px;font-family:var(--pixel);font-weight:700;font-size:19px}
:root[data-mode="shonen"] .set.on{background:var(--pitch);color:#fff}
:root[data-mode="shonen"] .done-btn.on{background:var(--pitch);color:#fff}
:root[data-mode="shonen"] .primary{font-family:var(--pixel);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.06em;font-size:18px;border-radius:12px;box-shadow:0 5px 0 #8BA81F}
:root[data-mode="shonen"] .primary:active{transform:translateY(3px);box-shadow:0 2px 0 #8BA81F}
:root[data-mode="shonen"] .primary i{border-radius:8px}
/* chrono façon chronomètre de piste */
:root[data-mode="shonen"] .timer{background:rgba(4,14,9,.6)}
:root[data-mode="shonen"] .timer .box{background:var(--c1);border-radius:22px;box-shadow:0 0 0 6px var(--pitch),0 24px 60px rgba(0,0,0,.5)}
:root[data-mode="shonen"] .timer .t{font-family:var(--pixel);font-weight:800;font-style:italic;font-size:64px;letter-spacing:.01em}
:root[data-mode="shonen"] .timer .what{font-family:var(--pixel);font-weight:700;letter-spacing:.14em;font-size:13px}
:root[data-mode="shonen"] .timer .ex-name{font-family:var(--pixel);font-weight:800;font-style:italic;text-transform:uppercase;font-size:26px}
:root[data-mode="shonen"] .timer .clock .fg{stroke:var(--track);stroke-linecap:butt}
:root[data-mode="shonen"] .timer .btns button.go{background:var(--pitch);color:#fff}
:root[data-mode="shonen"] .timer.over .box{background:var(--c2)}
:root[data-mode="shonen"] .timer.over .btns button.go{color:var(--c2);background:var(--on)}
:root[data-mode="shonen"] .timer.delay .box{animation:sprint .3s cubic-bezier(.2,.9,.25,1) both}
@keyframes sprint{from{transform:translateX(60px) skewX(-12deg);opacity:0}70%{transform:translateX(-4px) skewX(2deg);opacity:1}to{transform:none}}
:root[data-mode="shonen"] .add{border-color:var(--line);color:var(--c2);border-radius:14px}
:root[data-mode="shonen"] .smoke{display:none}
/* haut de page allégé en mode Stade */
:root[data-mode="shonen"] .wrap{gap:22px}
:root[data-mode="shonen"] .sync,:root[data-mode="shonen"] .stats{display:none}
:root[data-mode="shonen"] .tabs,:root[data-mode="shonen"] .modes{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
:root[data-mode="shonen"] .day{background:transparent;box-shadow:none}
:root[data-mode="shonen"] .day.has small::after{background:var(--c2)}
:root[data-mode="shonen"] .day.today:not(.sel){box-shadow:inset 0 0 0 1px var(--line)}
/* Disposition focus (3e mode) */
:root[data-mode="shonen"] .hud{background:transparent;border-radius:0;padding:0;box-shadow:none;gap:8px}
:root[data-mode="shonen"] .hud-top .lbl{font-family:var(--pixel);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--c2)}
:root[data-mode="shonen"] .hud-top .num{font-family:var(--pixel);font-weight:800;font-style:italic;font-size:26px;color:var(--ink)}
/* barre de progression : une ligne fine avec un repère qui avance */
.runbar{position:relative;height:6px;border-radius:99px;background:var(--line);margin:10px 0 2px}
.runbar .fill{position:absolute;left:0;top:0;bottom:0;width:var(--p);border-radius:99px;background:var(--c2);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.runbar .dot{position:absolute;top:50%;left:var(--p);width:18px;height:18px;border-radius:50%;background:var(--c2);transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--bg),0 0 14px rgba(215,255,58,.5);transition:left .35s cubic-bezier(.2,.8,.2,1)}
.run-ends{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--pixel)}
:root[data-mode="shonen"] .hud-stats b{color:var(--c2)}
:root[data-mode="shonen"] .arc-row{border-radius:12px}
:root[data-mode="shonen"] .arc-row .nm{font-size:20px;font-weight:700}
:root[data-mode="shonen"] .arc-row .idx{background:none;font-family:var(--pixel);font-weight:800;font-style:italic;font-size:22px;color:var(--muted)}
:root[data-mode="shonen"] .arc-row.done .idx{background:none;color:var(--c2)}
/* Disposition Arcade */
.hud{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.hud-top .lbl{color:var(--c1);font-family:var(--pixel);font-weight:500}
.segbar{display:flex;gap:3px}
.segbar i{flex:1;height:14px;border-radius:3px;background:rgba(255,255,255,.1);transition:background .2s}
.segbar i.on{background:var(--c1);box-shadow:0 0 10px rgba(158,230,197,.45)}
.hud-stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.hud-stats b{color:var(--ink);font-weight:700}
.arc-list{display:flex;flex-direction:column;gap:8px}
.arc-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:background .15s}
.arc-row:hover{background:var(--surface-2)}
.arc-row .idx{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12.5px;background:var(--surface-2);color:var(--c1)}
.arc-row .nm{flex:1;min-width:0;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--pixel)}
.arc-row .mt{flex:none;font-size:12.5px;color:var(--muted)}
.arc-row.done{opacity:.55}
.arc-row.done .idx{background:var(--c1);color:var(--on)}
.ex.focus{margin-block:4px}
.ex.focus .sets.big .set{width:52px;height:52px;font-size:17px}
.load{grid-column:2;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.45);border-radius:12px;padding:6px 6px 6px 12px;max-width:260px}
.load span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--on-soft)}
.load input{flex:1;min-width:0;border:0;background:rgba(255,255,255,.7);border-radius:8px;padding:8px 10px;font-weight:700;color:var(--on);font-size:15px}
.load input:focus{outline:2px solid var(--on)}
@media (max-width:420px){.arc-row .mt{max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.jp,.jpday,.kanji,.petals{display:none!important}
:root[data-mode="shonen"] .sticker.burst{width:78px;height:78px;top:-24px;right:-6px;transform:rotate(-8deg);filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
:root[data-mode="shonen"] .sticker.burst text{font-family:var(--pixel);font-weight:800;font-style:italic;font-size:17px;fill:var(--on)}
@keyframes blink{50%{opacity:0}}
.flash{position:fixed;inset:0;z-index:45;pointer-events:none;background:#fff;animation:flash .35s ease-out forwards}
@keyframes flash{0%{opacity:.28}100%{opacity:0}}
.win{position:fixed;inset:0;z-index:46;pointer-events:none;display:grid;place-items:center}
.win span{font-family:"Barlow Condensed","Urbanist",sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(40px,11vw,76px);line-height:1;text-align:center;padding:0 20px;color:#D7FF3A;text-shadow:4px 4px 0 #1C6B3F;animation:win 1.3s ease-out forwards}
@keyframes win{0%{transform:scale(1.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}
@media (prefers-reduced-motion:reduce){.flash,.win{display:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* décors propres à certains modes : masqués partout ailleurs */
.celsky,.celland,.goldsea,.painted{display:none!important}
:root:not([data-mode="fight"]) .epic{display:none!important}
body{background:var(--bg);color:var(--ink);font:500 15.5px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
/* Fumée façon manga (mode Shōnen uniquement) */
.smoke{display:none}
:root[data-mode="shonen"] .smoke{display:block;position:absolute;top:0;left:0;right:0;height:260px;overflow:hidden;pointer-events:none;z-index:0;opacity:.95;
  -webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.smoke svg{width:100%;height:100%;display:block}
.poof{position:fixed;inset:0;z-index:29;pointer-events:none;display:grid;place-items:center}
.poof svg{width:min(560px,130vw);animation:poof var(--dur,1.1s) cubic-bezier(.22,1,.36,1) forwards}
@keyframes poof{0%{transform:scale(.55);opacity:0;filter:blur(4px)}30%{transform:scale(.95);opacity:.95;filter:blur(0)}100%{transform:scale(1.45);opacity:0;filter:blur(6px)}}
@media (prefers-reduced-motion:reduce){.poof{display:none}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:12px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px}
.app-name{display:inline-flex;align-items:center;gap:6px;font:inherit;color:inherit;border-radius:8px;padding:2px 4px;margin-left:-4px}
.app-name svg{width:14px;height:14px;opacity:.35;transition:opacity .15s}
.app-name:hover svg,.app-name:focus-visible svg{opacity:.8}
.name-edit{display:flex;gap:6px;align-items:center}
.name-edit input{font:inherit;font-size:16px;width:min(46vw,220px);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink)}
.name-edit input:focus{outline:none;border-color:var(--c1)}
.name-edit .ghost{padding:7px 12px}
.app-title{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.brand img{width:38px;height:38px;border-radius:11px;display:block}
.sync{font-size:12.5px;color:var(--muted)}

/* Semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 0 11px;min-width:0;
  border-radius:16px;background:var(--surface);color:var(--muted);transition:transform .15s,background .15s}
.day b{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;color:var(--ink)}
.day small{font-size:12.5px;font-weight:600}
.day:hover{transform:translateY(-2px)}
.day.has small::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--lav);margin:3px auto 0}
.day.sel{background:var(--lav);color:var(--on-soft);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.day.sel small::after{background:var(--on)}
.day.sel b{color:#FFFFFF}
.day .chk{position:absolute;top:5px;right:5px;width:15px;height:15px;border-radius:50%;background:var(--mint);color:var(--on);font-size:9px;font-weight:900;display:grid;place-items:center;line-height:1}

.day.today{box-shadow:inset 0 0 0 1.5px var(--muted)}
.day.today.sel{box-shadow:0 8px 20px rgba(0,0,0,.45)}
@media (max-width:400px){.day b{font-size:17px}.day small{font-size:11.5px}.day{border-radius:14px}}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stats span{font-size:13px;color:var(--muted);background:var(--surface);padding:6px 12px;border-radius:99px}
.stats strong{color:var(--ink);font-weight:800}

/* Titre de séance */
.hero{display:flex;flex-direction:column;gap:16px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,9.5vw,58px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
h2.subtitle{font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(26px,6.6vw,34px);line-height:1.05;letter-spacing:-.01em;margin:10px 0 -2px}
h1 em{display:block;font-style:italic;font-weight:300;letter-spacing:-.01em}
.ghost{font-size:13.5px;font-weight:700;padding:9px 16px;border-radius:99px;background:var(--surface);color:var(--ink)}
.ghost:hover{background:var(--surface-2)}

/* Carte progression */
.progress{position:relative;background:var(--peach);color:var(--on);border-radius:var(--r);padding:20px 22px;display:flex;align-items:center;gap:18px;overflow:visible}
.progress .big{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,56px);line-height:1;letter-spacing:-.03em}
.progress .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.progress .lbl{font-weight:700;font-size:14px;padding-right:66px;line-height:1.25}
.progress .sub{font-size:13px;color:var(--on-soft)}
.ring{width:96px;height:96px;flex:none;order:-1}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--on-faint)}
.ring .fg{stroke:var(--on);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{fill:var(--on);font-family:var(--display);font-weight:800;font-size:17px}
.ring .small{font-size:10px;font-weight:700;fill:var(--on-soft)}
.sticker{position:absolute;top:-20px;right:-4px;width:74px;height:74px;transform:rotate(-6deg);pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.12))}
.sticker text{font-family:var(--display);font-weight:700;font-size:13.5px;fill:var(--ever);opacity:.85}

/* Exercices */
.list{display:flex;flex-direction:column;gap:12px}
.ex{--card:var(--pink);display:grid;grid-template-columns:auto 1fr;gap:8px 14px;padding:20px;background:var(--card);color:var(--on);border-radius:var(--r);transition:transform .2s}
.ex .idx{width:30px;height:30px;border-radius:50%;background:var(--on);color:var(--card);display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:1px}
.ex .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0}
.ex h3{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(21px,5.2vw,25px);line-height:1.12;letter-spacing:-.015em;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.badge{flex:none;font-size:12px;font-weight:800;background:var(--on);color:var(--card);padding:5px 10px;border-radius:99px}
.ex .spec{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.ex .spec span{font-size:13px;font-weight:700;color:var(--on);background:var(--on-faint);padding:4px 11px;border-radius:99px}
.ex .spec span.main{background:var(--on);color:var(--card)}
.ex .note{grid-column:2;font-size:13.5px;color:var(--on-soft);font-weight:600}
.sets{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center}
.set{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(20,20,24,.35);font-size:15px;font-weight:800;color:var(--on);transition:transform .12s,background .15s}
.set:hover{box-shadow:inset 0 0 0 2px var(--on)}
.set.on{background:var(--on);color:var(--card);box-shadow:none}
.set:active{transform:scale(.9)}
.ex.next-up{animation:nextup 1.1s ease-out}
@keyframes nextup{0%{box-shadow:0 0 0 0 rgba(255,255,255,.0)}25%{box-shadow:0 0 0 5px rgba(255,255,255,.55)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
/* numéro de l'exercice : se colore dès la première série, coche une fois terminé */
.ex .idx{transition:background .2s,color .2s,transform .2s}
.ex .idx.go{background:#fff;color:var(--on);box-shadow:0 0 0 2px var(--on)}
.ex .idx.ok{background:var(--done);color:var(--on);box-shadow:0 0 0 2px var(--on);transform:scale(1.08)}
.done-btn{padding:12px 20px;border-radius:99px;font-weight:800;font-size:14.5px;color:var(--on);box-shadow:inset 0 0 0 1.5px rgba(20,20,24,.35);transition:background .15s,transform .12s}
.done-btn:hover{box-shadow:inset 0 0 0 2px var(--on)}
.done-btn:active{transform:scale(.96)}
.done-btn.on{background:var(--on);color:var(--card);box-shadow:none}
.sets-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-soft);font-weight:800;margin-right:4px}
.items{grid-column:2;list-style:none;margin:2px 0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:it}
.items li{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,.4);border-radius:14px;counter-increment:it}
.items li::before{content:counter(it);font-weight:800;font-size:13px;width:12px}
.items li span{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.items li b{font-size:13px;color:var(--on-soft);font-weight:700;white-space:nowrap}

.cta{display:flex;gap:10px;flex-wrap:wrap}
.primary{display:inline-flex;align-items:center;gap:12px;background:var(--btn);color:var(--btn-ink);font-weight:800;padding:8px 8px 8px 22px;border-radius:99px;font-size:15px}
.primary i{width:36px;height:36px;border-radius:50%;background:var(--btn-ink);color:var(--btn);display:grid;place-items:center;font-style:normal}
.primary.ok{background:var(--mint);color:var(--on)}
.primary.ok i{background:var(--on);color:var(--mint)}
.primary.plain{padding:12px 22px}
.rest{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.rest p{margin:0;color:var(--muted);max-width:44ch}

/* Navigation du bas */
.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* barre givrée : icônes + libellés, onglet actif en pastille teintée, bouton central surélevé */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:25;
  width:min(460px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);align-items:center;gap:2px;
  padding:8px 8px 7px;border-radius:28px;
  background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 12px 34px rgba(0,0,0,.22)}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;padding:0 0 1px;min-width:0;transition:color .2s}
.bn .bi{width:46px;height:34px;border-radius:14px;display:grid;place-items:center;transition:background .25s,transform .15s}
.bn svg{width:22px;height:22px}
.bn .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bn.on{color:var(--navc)}
.bn.on .bi{background:color-mix(in srgb,var(--navc) 18%,transparent)}
.bn.on svg{stroke-width:2.3}
.bn:active .bi{transform:scale(.9)}
.fab{width:58px;height:58px;justify-self:center;margin-top:-30px;margin-bottom:6px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,color-mix(in srgb,var(--navc) 75%,#fff),var(--navc));
  box-shadow:0 10px 22px color-mix(in srgb,var(--navc) 45%,transparent),0 0 0 5px color-mix(in srgb,var(--bg) 70%,transparent);transition:transform .15s}
.fab svg{width:24px;height:24px}
.fab:active{transform:scale(.92)}
:root{--navc:#9479F2}
:root[data-mode="light"]{--navc:#6E4FE3}
:root[data-mode="light"] .bnav{background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 12px 34px rgba(60,50,120,.18)}
:root[data-mode="shonen"]{--navc:#D7FF3A}
:root[data-mode="shonen"] .fab{color:var(--on)}
.page-h{margin:0}
.wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
@media (max-width:370px){.bn .bl{font-size:10px}.bn .bi{width:40px}}
/* Paramètres */
.settings{display:flex;flex-direction:column;gap:16px}
.settings h1{font-size:clamp(34px,9vw,48px)}
.set-input{font:inherit;font-size:17px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);width:100%}
.set-input:focus{outline:none;border-color:var(--c1)}
.small{font-size:13px}
.mode-list{display:flex;flex-direction:column;gap:8px}
.mode-opt{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--surface-2);text-align:left;width:100%;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s}
.mode-opt.on{box-shadow:inset 0 0 0 2px var(--c1)}
.mode-opt .mi{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--ink)}
.mode-opt.on .mi{background:var(--c1);color:var(--on)}
.mode-opt .mi svg{width:20px;height:20px}
.mode-opt .mt{flex:1;min-width:0;display:flex;flex-direction:column}
.mode-opt .mt b{font-size:16px}
.mode-opt .mt small{font-size:12.5px;color:var(--muted)}
.mode-opt .mc{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;background:var(--c1);color:var(--on)}
.mode-opt:not(.on) .mc{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
:root[data-mode="shonen"] .settings h1{font-size:clamp(38px,9.5vw,56px)}
/* Onglets + historique */
.tabs{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--surface);align-self:flex-start}
.tab{padding:9px 18px;border-radius:99px;font-weight:700;font-size:14px;color:var(--muted)}
.tab.on{background:var(--lav);color:var(--on)}
.hist{display:flex;flex-direction:column;gap:16px}
.hist-empty{background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hist-empty p{margin:0;color:var(--muted);max-width:52ch}
.demo-note{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.demo-note button{color:var(--c1);font-weight:700;text-decoration:underline}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.month-nav h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(26px,6.5vw,34px)}
.month-nav .icon{font-size:22px;background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05}
.kpi b small{font-size:16px;color:var(--muted);font-weight:700}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal-h{font-size:11px;font-weight:700;color:var(--muted)}
.cal-d{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface-2)}
.cal-d.full{background:var(--c1);color:var(--on)}
.cal-d.ok,.cal-d.part{background:color-mix(in srgb,var(--c1) 38%,var(--surface-2));color:var(--ink)}
.cal-d.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--surface-2)}
.legend i.full,.legend i.dn{background:var(--c1)}
.legend i.part{background:color-mix(in srgb,var(--c1) 38%,var(--surface-2))}
.legend i.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.legend i.pl{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-stack{position:relative;width:100%;max-width:34px;height:110px}
.bar-stack span{position:absolute;left:0;right:0;bottom:0;border-radius:8px 8px 3px 3px}
.bar-stack .pl{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.bar-stack .dn{background:var(--c1)}
.bar-col b{font-size:14px}
.bar-col small{font-size:11.5px;color:var(--muted);font-weight:600}
.loads{display:flex;flex-direction:column}
.load-row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.load-row:first-child{border-top:0}
.load-row .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load-row .spark{width:90px;height:30px;color:var(--c1)}
.load-row .v{font-weight:800}
.load-row .dl{font-size:12.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);min-width:58px;text-align:center}
.load-row .dl.up{background:var(--c1);color:var(--on)}
.load-row .dl.down{background:rgba(255,120,110,.18);color:var(--danger)}
@media (max-width:420px){.load-row .spark{width:60px}}
.muted{color:var(--muted);margin:0}
/* Programme */
.prog{display:flex;flex-direction:column;gap:10px}
.prog-row{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 10px;background:var(--surface);border-radius:22px;text-align:left;width:100%}
.prog-row:hover{background:var(--surface-2)}
.prog-row .d{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:13px;text-transform:uppercase;color:var(--on);flex:none}
.prog-row .t{flex:1;min-width:0}
.prog-row .t b{display:block;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-row .t span{font-size:13px;color:var(--muted)}
.prog-row .arrow{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink);flex:none}
.add{border:1.5px dashed var(--line);border-radius:22px;padding:15px;color:var(--muted);font-weight:700;font-size:14.5px}
.add:hover{color:var(--ink);border-color:var(--muted)}
.example{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.example button{color:var(--yellow);font-weight:700}

/* Éditeur */
.editor{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;width:100%;min-width:0}
.field input:focus,.field select:focus,.item-row input:focus{outline:none;border-color:var(--yellow)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ed-ex{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--card,var(--pink))}
.ed-ex .name{font-weight:800;font-size:18px}
.ed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ed-grid .field input{padding:9px 11px;font-size:14px}
.ed-grid .label{font-size:10.5px}
.ed-tools{display:flex;gap:4px;justify-content:flex-end}
.icon{width:34px;height:34px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon.del:hover{color:var(--danger)}
.icon:disabled{opacity:.3;cursor:default}
.item-row{display:flex;gap:8px;align-items:center}
.item-row input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.item-row input.reps{flex:0 0 96px}
.danger{color:var(--danger);font-weight:700;font-size:14px}
.confirm{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (max-width:480px){.ed-grid{grid-template-columns:1fr 1fr}.ring{width:80px;height:80px}.progress{padding:18px}}

/* Minuteur de repos : pop-up centrée */
.timer{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background:rgba(5,9,30,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .18s ease-out}
.timer .box{width:min(340px,100%);background:var(--yellow);color:var(--on);border-radius:32px;padding:26px 22px 22px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:rise .26s cubic-bezier(.2,.8,.2,1)}
.timer.over .box{background:var(--c2)}
.timer .what{font-size:13px;font-weight:700;color:var(--on-soft);letter-spacing:.06em;text-transform:uppercase}
.timer .ex-name{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15;margin-top:-8px;overflow-wrap:anywhere}
.timer .clock{position:relative;width:190px;height:190px;max-width:100%}
.timer .clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .clock circle{fill:none;stroke-width:10}
.timer .clock .bgc{stroke:var(--on-faint)}
.timer .clock .fg{stroke:var(--on);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:52px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer .btns{display:flex;gap:8px;width:100%}
.timer .btns button{flex:1;border-radius:99px;padding:12px 0;font-size:14px;font-weight:800;background:var(--on-faint);color:var(--on)}
.timer .btns button.go{flex:1.4;background:var(--on);color:var(--yellow)}
.timer.over .btns button.go{color:var(--c2)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(10px) scale(.96);opacity:0}to{transform:none;opacity:1}}
/* mode Arcade : la pop-up s'allume comme un vieil écran (une ligne qui s'ouvre) */
@keyframes crt{0%{transform:scale(.3,.015);opacity:1;filter:brightness(2.2)}45%{transform:scale(1,.015);filter:brightness(1.8)}100%{transform:none;filter:none}}
.timer .clock .fg{animation:ringin .45s cubic-bezier(.2,.8,.2,1) .1s backwards}
@keyframes ringin{from{stroke-dashoffset:534}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Mode Combat : manga d'action années 90 + interface RPG — décor monumental, contours noirs, aplats, auras */
:root[data-mode="fight"]{
  --bg:#0B1D4D; --surface:#F6F1E7; --surface-2:#E9E1D1; --ink:#F6F1E7; --muted:#B9C3E6; --line:rgba(17,17,17,.9);
  --f1:#F6F1E7; --f2:#FFE9C7; --f3:#E3ECFF;
  --c1:#F5A04A; --c2:#FFE234; --c3:#2FBF71; --yellow:#FFE234; --pink:#F5A04A; --lav:#F5A04A; --peach:#111111; --mint:#2FBF71; --ever:#111111;
  --on:#111111; --on-soft:rgba(17,17,17,.7); --on-faint:rgba(17,17,17,.1);
  --btn:#F5A04A; --btn-ink:#111111; --sticker:#FFE234; --navc:#F5A04A; --danger:#E5452E; --r:16px; color-scheme:dark;
  --or:#F5A04A; --bl:#1A3FA8; --ye:#FFE234; --bk:#111111; --wh:#F6F1E7; --gr:#2FBF71;
  --hud:"Chakra Petch","Urbanist",ui-monospace,monospace;
}
:root[data-mode="fight"]{background:#5B4FA8}
:root[data-mode="fight"] body{background:#5B4FA8}
:root[data-mode="fight"] body::before{background:#5B4FA8}
.epic{display:none}
:root[data-mode="fight"] .epic{display:block;position:fixed;inset:0;z-index:0;pointer-events:none}
.epic svg{width:100%;height:100%;display:block}
.epic i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#FFE234;box-shadow:0 0 8px #FFE234;opacity:0;animation:spark 7s linear infinite}
.epic .sw1{animation:sway 6s ease-in-out infinite}
.epic .sw2{animation:sway 7.5s ease-in-out infinite reverse}
.epic .fr{animation:frond 3.2s ease-in-out infinite}
.epic .drift{animation:drift 40s linear infinite alternate}
.epic .tw{animation:tw 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
@keyframes frond{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
@keyframes drift{from{transform:translateX(-20px)}to{transform:translateX(24px)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.epic .sw1,.epic .sw2,.epic .fr,.epic .drift,.epic .tw{animation:none}}
.epic i{background:#FFE7B0!important;box-shadow:0 0 8px #FFD3A6!important}
@keyframes spark{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-70vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.epic i{display:none}}
:root[data-mode="fight"] .goldsea,:root[data-mode="fight"] .celsky,:root[data-mode="fight"] .celland{display:none!important}
/* titres : manga, blanc cassé cerné de noir */
:root[data-mode="fight"] h1,:root[data-mode="fight"] h2.subtitle,:root[data-mode="fight"] .settings h1,:root[data-mode="fight"] .month-nav h2,:root[data-mode="fight"] .page-h{
  font-family:"Bangers","Urbanist",system-ui,sans-serif;font-weight:400;letter-spacing:.03em;color:var(--wh);-webkit-text-stroke:4px rgba(17,17,17,.85);paint-order:stroke fill;text-shadow:0 4px 14px rgba(8,25,60,.35)}
:root[data-mode="fight"] h1{font-size:clamp(42px,11vw,64px);line-height:.95}
:root[data-mode="fight"] h1 em{font-style:normal;color:var(--or);display:block}
:root[data-mode="fight"] h2.subtitle{font-style:normal;font-size:clamp(26px,6.6vw,34px)}
:root[data-mode="fight"] .app-title{font-family:"Bangers",sans-serif;font-weight:400;letter-spacing:.04em;font-size:24px;color:var(--wh);-webkit-text-stroke:4px var(--bk);paint-order:stroke fill}
:root[data-mode="fight"] .label{font-family:var(--hud);font-weight:700;letter-spacing:.14em;color:#fff;text-shadow:0 1px 6px rgba(8,25,60,.55)}
:root[data-mode="fight"] .sync{color:var(--muted)}
:root[data-mode="fight"] .ex h3,:root[data-mode="fight"] .ex .spec,:root[data-mode="fight"] .ex .note{color:var(--bk)}
/* semaine */
:root[data-mode="fight"] .day{background:var(--wh);box-shadow:0 0 0 1.5px rgba(17,17,17,.6),0 10px 24px rgba(8,25,60,.28);color:#555}
:root[data-mode="fight"] .day b{color:var(--bk);font-family:var(--hud)}
:root[data-mode="fight"] .day.sel{background:var(--or);transform:translateY(-3px);box-shadow:0 0 0 1.5px rgba(17,17,17,.6),0 10px 24px rgba(8,25,60,.28)}
:root[data-mode="fight"] .day.sel b{color:#fff;-webkit-text-stroke:3px var(--bk);paint-order:stroke fill}
:root[data-mode="fight"] .day.sel small{color:var(--bk)}
:root[data-mode="fight"] .day.has small::after{background:var(--bl)}
:root[data-mode="fight"] .day.today:not(.sel){box-shadow:0 0 0 2.5px var(--ye),0 10px 24px rgba(8,25,60,.28)}
:root[data-mode="fight"] .stats span{background:rgba(10,30,70,.55);color:var(--wh);font-family:var(--hud)}
:root[data-mode="fight"] .stats strong{color:var(--ye)}
/* cartes d'exercices : planches de manga */
:root[data-mode="fight"] .ex{border-radius:14px;background:var(--card);box-shadow:0 0 0 1.5px rgba(17,17,17,.6),0 10px 24px rgba(8,25,60,.28);
  background-image:linear-gradient(118deg,transparent 64%,rgba(17,17,17,.05) 64%)}
:root[data-mode="fight"] .ex .idx{border-radius:8px;background:var(--bk);color:var(--ye);font-family:var(--hud)}
:root[data-mode="fight"] .ex .idx.go{background:var(--or);color:var(--bk);box-shadow:0 0 0 1.5px rgba(17,17,17,.55)}
:root[data-mode="fight"] .ex .idx.ok{background:var(--gr);color:var(--bk);box-shadow:0 0 0 1.5px rgba(17,17,17,.55);transform:none}
:root[data-mode="fight"] .ex .spec span{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(17,17,17,.35);font-family:var(--hud)}
:root[data-mode="fight"] .ex .spec span.main{background:var(--bl);color:#fff;box-shadow:none}
:root[data-mode="fight"] .set{background:#fff;box-shadow:0 0 0 1.5px rgba(17,17,17,.6);font-family:var(--hud)}
:root[data-mode="fight"] .set.on{background:var(--or);color:var(--bk);box-shadow:0 0 0 1.5px rgba(17,17,17,.6),inset 0 -4px 0 rgba(0,0,0,.18)}
:root[data-mode="fight"] .done-btn{background:#fff;box-shadow:0 0 0 1.5px rgba(17,17,17,.6)}
:root[data-mode="fight"] .done-btn.on{background:var(--gr);color:var(--bk)}
:root[data-mode="fight"] .badge{background:var(--gr);color:var(--bk);font-family:var(--hud);box-shadow:0 0 0 1.5px rgba(17,17,17,.55)}
:root[data-mode="fight"] .load{background:rgba(17,17,17,.06);box-shadow:inset 0 0 0 1.5px rgba(17,17,17,.25)}
:root[data-mode="fight"] .ex.complete{background-color:#DFF5E8}
/* boutons, panneaux, navigation */
:root[data-mode="fight"] .primary{font-family:"Bangers",sans-serif;font-weight:400;letter-spacing:.06em;font-size:21px;color:var(--bk);box-shadow:0 0 0 1.5px rgba(17,17,17,.6),0 10px 24px rgba(8,25,60,.28)}
:root[data-mode="fight"] .primary.ok{background:var(--gr)}
:root[data-mode="fight"] .primary i{background:var(--bk);color:var(--ye)}
:root[data-mode="fight"] .primary:active{transform:translate(3px,3px);box-shadow:0 0 0 1.5px rgba(17,17,17,.6),0 10px 24px rgba(8,25,60,.28)}
:root[data-mode="fight"] .ghost{background:var(--wh);color:var(--bk);box-shadow:0 0 0 1.5px rgba(17,17,17,.55)}
:root[data-mode="fight"] .prog-row,:root[data-mode="fight"] .panel,:root[data-mode="fight"] .kpi,:root[data-mode="fight"] .mode-opt,:root[data-mode="fight"] .hist-empty{background:var(--wh);color:var(--bk);box-shadow:0 0 0 1.5px rgba(17,17,17,.6),0 10px 24px rgba(8,25,60,.28)}
:root[data-mode="fight"] .prog-row .t span,:root[data-mode="fight"] .kpi span,:root[data-mode="fight"] .mode-opt .mt small,:root[data-mode="fight"] .panel .muted,:root[data-mode="fight"] .legend,:root[data-mode="fight"] .bar-col small,:root[data-mode="fight"] .cal-h{color:#555}
:root[data-mode="fight"] .panel .label{color:var(--bl)}
:root[data-mode="fight"] .mode-opt.on{box-shadow:0 0 0 3px var(--or),0 10px 24px rgba(8,25,60,.28)}
:root[data-mode="fight"] .set-input{background:#fff;color:var(--bk);border-color:var(--bk)}
:root[data-mode="fight"] .bnav{background:rgba(14,26,56,.78);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 12px 30px rgba(8,25,60,.35)}
:root[data-mode="fight"] .bn{color:#9AA3C4}
:root[data-mode="fight"] .bn.on{color:var(--or)}
:root[data-mode="fight"] .bn.on .bi{background:rgba(245,160,74,.18)}
/* chrono : afficheur de combat */
:root[data-mode="fight"] .timer{background:rgba(5,10,30,.6)}
:root[data-mode="fight"] .timer .box{background:var(--bk);color:var(--wh);border-radius:18px;box-shadow:0 0 0 3px var(--or),0 0 40px rgba(245,160,74,.35)}
:root[data-mode="fight"] .timer .what{color:var(--ye);font-family:var(--hud)}
:root[data-mode="fight"] .timer .ex-name{font-family:"Bangers",sans-serif;font-weight:400;letter-spacing:.04em;font-size:26px}
:root[data-mode="fight"] .timer .t{font-family:var(--hud);font-weight:700;font-size:56px;color:var(--ye);text-shadow:0 0 18px rgba(255,226,52,.45)}
:root[data-mode="fight"] .timer .clock .bgc{stroke:rgba(255,255,255,.12)}
:root[data-mode="fight"] .timer .clock .fg{stroke:var(--or)}
:root[data-mode="fight"] .timer .btns button{background:rgba(255,255,255,.1);color:var(--wh);font-family:var(--hud)}
:root[data-mode="fight"] .timer .btns button.go{background:var(--or);color:var(--bk)}
:root[data-mode="fight"] .timer.over .box{box-shadow:0 0 0 3px var(--gr),0 0 40px rgba(47,191,113,.4)}
:root[data-mode="fight"] .timer.over .btns button.go{background:var(--gr)}
:root[data-mode="fight"] .timer.delay .box{animation:rise .28s .06s cubic-bezier(.2,.8,.2,1) both}

/* écran « Modifier la séance » : texte foncé sur cartes claires, champs bien lisibles */
:root[data-mode="fight"] .editor>.label,:root[data-mode="fight"] .editor>.field>.label,:root[data-mode="fight"] .editor .row2 .label{color:var(--ye)}
:root[data-mode="fight"] .field input,:root[data-mode="fight"] .field select,:root[data-mode="fight"] .item-row input{background:#FFFFFF;color:var(--bk);border:2px solid var(--bk);font-weight:600}
:root[data-mode="fight"] .field input::placeholder,:root[data-mode="fight"] .item-row input::placeholder{color:#8A8478}
:root[data-mode="fight"] .field input:focus,:root[data-mode="fight"] .field select:focus,:root[data-mode="fight"] .item-row input:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(245,160,74,.35)}
:root[data-mode="fight"] .field select option{color:var(--bk);background:#fff}
:root[data-mode="fight"] .ed-ex{background:var(--wh);color:var(--bk);border-top:0;box-shadow:0 0 0 1.5px rgba(17,17,17,.6),0 10px 24px rgba(8,25,60,.28);border-left:8px solid var(--card)}
:root[data-mode="fight"] .ed-ex .label{color:var(--bl)}
:root[data-mode="fight"] .ed-ex .icon{color:#444}
:root[data-mode="fight"] .ed-ex .icon:hover{background:#E9E1D1;color:var(--bk)}
:root[data-mode="fight"] .ed-ex .icon.del:hover{color:var(--danger)}
:root[data-mode="fight"] .editor .add{background:rgba(17,17,17,.55);border-color:var(--or);color:var(--wh)}
:root[data-mode="fight"] .editor .danger{color:#FF9A86}
:root[data-mode="fight"] .editor .confirm{color:var(--wh)}
/* ===== tableau de bord du combattant ===== */
.fhud{display:flex;flex-direction:column;gap:12px}
.fcard{position:relative;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;border-radius:16px;background:rgba(10,14,32,.88);color:var(--wh);
  box-shadow:0 0 0 1.5px rgba(17,17,17,.55),inset 0 0 0 1.5px rgba(245,160,74,.55),0 10px 24px rgba(8,25,60,.28)}
.fcard::before,.fcard::after{content:"";position:absolute;width:16px;height:16px;border:2.5px solid var(--ye)}
.fcard::before{top:6px;left:6px;border-right:0;border-bottom:0}.fcard::after{bottom:6px;right:6px;border-left:0;border-top:0}
.portrait{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center}
.portrait::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0 45%,transparent 70%);animation:auraP 1.6s ease-in-out infinite}
.portrait img{position:relative;width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px rgba(17,17,17,.6),0 0 0 6px var(--aura)}
@keyframes auraP{0%,100%{transform:scale(.94);opacity:.75}50%{transform:scale(1.08);opacity:1}}
@media (prefers-reduced-motion:reduce){.portrait::before{animation:none}}
.finfo{min-width:0;display:flex;flex-direction:column;gap:5px}
.frow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.flv{font-family:var(--hud);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.flv b{font-family:"Bangers",sans-serif;font-weight:400;font-size:34px;letter-spacing:.02em;color:var(--wh);-webkit-text-stroke:4px var(--bk);paint-order:stroke fill;margin-left:4px;vertical-align:-4px}
.ftier{font-family:var(--hud);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--aura);color:var(--bk);box-shadow:0 0 12px var(--glow)}
.fpow{font-family:var(--hud);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fpow b{display:block;font-size:24px;letter-spacing:.02em;color:var(--ye);text-shadow:0 0 12px rgba(255,226,52,.4)}
.xpbar{position:relative;height:12px;border-radius:4px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);overflow:hidden}
.xpbar span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gr),#9BF0B9);box-shadow:0 0 10px rgba(47,191,113,.6);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(0,0,0,.35) 9% 10%)}
.fxp{font-family:var(--hud);font-size:11.5px;color:var(--muted)}
.fxp b{color:var(--wh)}
/* jauge de séance */
.gcard{padding:14px 16px;border-radius:16px;background:var(--wh);color:var(--bk);box-shadow:0 0 0 1.5px rgba(17,17,17,.6),0 10px 24px rgba(8,25,60,.28);display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ghead .t{font-weight:800;font-size:15px}
.ghead .v{font-family:"Bangers",sans-serif;font-size:32px;letter-spacing:.02em;line-height:1}
.pgauge{display:flex;gap:3px;height:18px;padding:3px;border-radius:6px;background:var(--bk)}
.pgauge i{flex:1;border-radius:2px;background:#2A2F45;transition:background .2s}
.pgauge i.on{background:linear-gradient(180deg,#FFE97A,var(--ye) 55%,#E8B900);box-shadow:0 0 8px rgba(255,226,52,.6)}
.pgauge i.on.hot{background:linear-gradient(180deg,#FFCB8E,var(--or) 55%,#D9822F)}
.gfoot{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--hud);font-size:12.5px;color:#444}
.gfoot b{color:var(--bk)}
.gfoot .xp{color:#138A4C}
/* missions */
.mcard{padding:12px 14px;border-radius:16px;background:rgba(10,14,32,.88);color:var(--wh);box-shadow:0 0 0 1.5px rgba(17,17,17,.55),inset 0 0 0 1.5px rgba(26,63,168,.9),0 10px 24px rgba(8,25,60,.28)}
.mcard .mh{font-family:var(--hud);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ye);margin-bottom:6px;display:flex;justify-content:space-between}
.mis{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px}
.mis:first-of-type{border-top:0}
.mis .ck{width:22px;height:22px;flex:none;border-radius:6px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);font-size:13px;font-weight:900}
.mis.done .ck{background:var(--gr);color:var(--bk);box-shadow:none}
.mis.done .mt{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.mis .mt{flex:1;min-width:0}
.mis .rw{font-family:var(--hud);font-size:12px;font-weight:700;color:var(--ye)}
/* caractéristiques + récompenses */
.fstats{display:grid;gap:10px}
.st{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:10px}
.st b{font-family:var(--hud);font-weight:700;font-size:13px;letter-spacing:.08em}
.st .bar{height:12px;border-radius:4px;background:#E2DACA;box-shadow:inset 0 0 0 1.5px var(--bk);overflow:hidden}
.st .bar span{display:block;height:100%;background:var(--gr);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.st .n{font-family:var(--hud);font-weight:700;text-align:right}
.st small{grid-column:1/-1;margin-top:-6px;font-size:12px;color:#555}
.rewards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:420px){.rewards{grid-template-columns:repeat(3,1fr)}.st{grid-template-columns:96px 1fr 36px}}
.rw-it{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.2}
.rw-ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--rc);box-shadow:0 0 0 1.5px rgba(17,17,17,.6),0 10px 24px rgba(8,25,60,.28)}
.rw-ic svg{width:30px;height:30px}
.rw-it.lock{color:#888}
.rw-it.lock .rw-ic{background:#D8D0BF;filter:grayscale(1);opacity:.6}
.rw-it small{font-weight:600;color:#777;font-size:10.5px}
/* effets de validation */
.fx{position:fixed;inset:0;z-index:31;pointer-events:none;display:grid;place-items:center}
.fx>*{grid-area:1/1}
.fx .burst{width:min(340px,80vw);height:min(340px,80vw)}
.fx .burst i{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--c,#FFE234);box-shadow:0 0 10px var(--c,#FFE234);animation:fly .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.4);opacity:0}}
.fx .gain{font-family:var(--hud);font-weight:700;font-size:30px;color:var(--ye);text-shadow:0 0 14px rgba(255,226,52,.7),2px 2px 0 #111;animation:gain .7s ease-out forwards}
@keyframes gain{0%{transform:translateY(10px) scale(.8);opacity:0}25%{transform:none;opacity:1}100%{transform:translateY(-60px);opacity:0}}
.lvup{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(255,226,52,.0) 0,rgba(5,10,30,.75) 70%);animation:lvbg 2.2s ease-out forwards}
.lvup>*{grid-area:1/1}
.lvup .ring{width:min(380px,90vw);height:min(380px,90vw);border-radius:50%;background:radial-gradient(circle,var(--glow) 0 30%,transparent 62%);animation:lvring 2.2s ease-out forwards}
.lvup .bolts{width:min(380px,90vw);animation:lvbolt 2.2s steps(6) forwards}
.lvup .txt{text-align:center;animation:lvtxt 2.2s cubic-bezier(.2,.9,.25,1) forwards}
.lvup .txt small{display:block;font-family:var(--hud);font-weight:700;letter-spacing:.2em;color:var(--ye);font-size:14px}
.lvup .txt b{display:block;font-family:"Bangers",sans-serif;font-weight:400;font-size:clamp(56px,16vw,96px);letter-spacing:.03em;color:var(--wh);-webkit-text-stroke:8px #111;paint-order:stroke fill;text-shadow:6px 6px 0 #111}
.lvup .txt span{display:inline-block;margin-top:6px;font-family:var(--hud);font-weight:700;font-size:15px;padding:4px 12px;border-radius:6px;background:var(--aura);color:#111}
@keyframes lvbg{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes lvring{0%{transform:scale(.2)}30%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes lvbolt{0%,100%{opacity:0}10%,30%,50%{opacity:1}20%,40%,60%{opacity:.2}}
@keyframes lvtxt{0%{transform:scale(1.8);opacity:0}15%{transform:scale(1);opacity:1}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fx,.lvup .bolts{display:none}}
/* onomatopées */
.boom{position:fixed;inset:0;z-index:31;pointer-events:none;display:grid;place-items:center}
.boom>*{grid-area:1/1}
.boom .impact{width:min(420px,92vw);animation:impact .62s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes impact{0%{transform:scale(.2) rotate(-10deg);opacity:0}30%{transform:scale(1.05) rotate(0);opacity:1}75%{opacity:1}100%{transform:scale(1.12);opacity:0}}
.boom span{font-family:"Bowlby One",sans-serif;font-size:clamp(54px,17vw,104px);color:#F2C14E;-webkit-text-stroke:9px #2A2238;paint-order:stroke fill;text-shadow:7px 7px 0 #2A2238;
  transform:rotate(-8deg);animation:boom .62s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes boom{0%{transform:rotate(-8deg) scale(.3);opacity:0}30%{transform:rotate(-8deg) scale(1.08);opacity:1}70%{transform:rotate(-8deg) scale(1);opacity:1}100%{transform:rotate(-8deg) scale(1.15);opacity:0}}
.win.ft span{font-family:"Bangers",sans-serif;font-weight:400;font-size:clamp(48px,14vw,90px);letter-spacing:.03em;color:#F5A04A;-webkit-text-stroke:7px #111;paint-order:stroke fill;text-shadow:5px 5px 0 #111}
@media (prefers-reduced-motion:reduce){.boom{display:none}}

/* ===== Mode Combat moderne : verre dépoli sur décor peint, carte mission, liste compacte, panneau coulissant ===== */
:root[data-mode="fight"] .wrap{gap:18px}
:root[data-mode="fight"] .stats{display:none}
:root[data-mode="fight"] .week{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:4px}
:root[data-mode="fight"] .week::-webkit-scrollbar{display:none}
:root[data-mode="fight"] .day{flex:1 0 46px;border-radius:16px;background:rgba(12,24,58,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#fff}
:root[data-mode="fight"] .day b{color:#fff}
:root[data-mode="fight"] .day small{color:rgba(255,255,255,.85)}
:root[data-mode="fight"] .day.sel{background:var(--or);box-shadow:0 8px 20px rgba(245,160,74,.45)}
:root[data-mode="fight"] .day.sel b{-webkit-text-stroke:0;color:#fff}
:root[data-mode="fight"] .day.sel small{color:#3a2310}
:root[data-mode="fight"] .day.today:not(.sel){box-shadow:inset 0 0 0 2px var(--ye)}
.fxg,.fx-hero,.fx-mission,.fx-r,.fx-chip{-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.fx-hero{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:24px;background:rgba(12,24,58,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 14px 34px rgba(8,25,60,.3);color:#fff}
.fx-hero .portrait,.fx-hero .portrait img{width:60px;height:60px}
.fx-hero .portrait img{box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 0 4px var(--aura)}
.fx-hero-i{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.fx-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fx-lv{font-family:var(--hud);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.fx-lv b{font-family:"Bangers",sans-serif;font-size:28px;letter-spacing:.02em;color:#fff;margin-left:2px}
.fx-sub{font-family:var(--hud);font-size:12px;color:rgba(255,255,255,.7)}
.fx-sub b{color:var(--ye)}
